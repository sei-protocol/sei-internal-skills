[project]
name = "sei-omnigent"
version = "0.1.0"
description = "Sei's out-of-tree Omnigent overlay — the store/identity seam (Sei Agentic Mesh, design #11)"
requires-python = ">=3.12"

# Pin Omnigent EXACTLY. The overlay clones part of Omnigent's serve boot
# sequence (DECISION-1 / _omnigent_shim), so it is only verified against this
# exact release. Bumping this pin is the trigger to re-run the shim drift check.
dependencies = [
    "omnigent==0.1.1",
]

[project.scripts]
# Sei's server entrypoint — replaces the stock `omnigent serve`, which hard-codes
# the stores. This drives build_server (the make_stores seam).
sei-omnigent-serve = "sei_omnigent.server.serve:build_server"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sei_omnigent*"]
