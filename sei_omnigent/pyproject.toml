[project]
name = "sei-omnigent"
version = "0.1.0"
description = "Sei's out-of-tree Omnigent overlay — the store/identity seam (Sei Agentic Mesh, design #11)"
requires-python = ">=3.12"

# Pin Omnigent EXACTLY. The overlay clones part of Omnigent's serve boot
# sequence (DECISION-1 / _omnigent_shim), so it is only verified against this
# exact release. Bumping this pin is the trigger to re-run the shim drift check.
dependencies = [
    "omnigent==0.2.0",
    # serve_main binds uvicorn directly (the runnable entrypoint, PLT-672). It
    # rides in transitively via omnigent, but the entrypoint imports it by name,
    # so declare it explicitly — a future omnigent pin that drops/extras uvicorn
    # would otherwise break the console script at runtime (drift-watch tied to the
    # shim's on-bump re-verify). Floor/ceiling mirrors omnigent's own
    # `uvicorn[standard]>=0.30,<1` so the two constraints can never conflict at
    # resolve time.
    "uvicorn>=0.30,<1",
    # The omni receiver + PagerDuty client import httpx by name (PLT-715). Like
    # uvicorn it rides in transitively via omnigent, but the overlay imports it
    # directly (and the omnigent-free unit suite mocks httpx.MockTransport), so
    # declare it explicitly. Range mirrors omnigent's own `httpx>=0.27,<1` so the
    # two constraints can never conflict at resolve time.
    "httpx>=0.27,<1",
    # --- Scoped pre-release allowance (PLT-735) ----------------------------
    # omnigent==0.1.1 constrains its opentelemetry-instrumentation-* deps as
    # `<1,>=0`, and those OTel projects publish ONLY pre-releases (0.XXbN) on
    # PyPI — no stable final exists in range. pip honors an EXACT `==<prerelease>`
    # pin WITHOUT global `--pre`, so these explicit pins scope the allowance to
    # exactly these packages (the whole resolve is not opened to betas).
    # `-fastapi` and `-httpx` are omnigent's direct deps; the other four ride in
    # transitively but release in lockstep on the same 0.63b train, so pin the
    # whole set. Re-evaluate on the next omnigent pin bump — if a future omnigent
    # tightens these to stable finals, delete this block.
    "opentelemetry-instrumentation==0.63b1",
    "opentelemetry-instrumentation-asgi==0.63b1",
    "opentelemetry-instrumentation-fastapi==0.63b1",
    "opentelemetry-instrumentation-httpx==0.63b1",
    "opentelemetry-semantic-conventions==0.63b1",
    "opentelemetry-util-http==0.63b1",
]

# Test deps. The pure overlay tests (seam/posture/policy/harness) run without an
# omnigent install (the omnigent-touching paths are AST-guarded / skip-if-absent),
# so `pip install .[test]` is enough for the unit suite. `pytest` is declared
# here because the suite now imports it as a library (pytest.raises), not just as
# the collector.
[project.optional-dependencies]
test = [
    "pytest>=7",
    "ruff>=0.6",
]

# The runnable entrypoint (PLT-672): config load + read-only-policy merge +
# uvicorn bind. The K8s deploy uses it as the container command (equivalently
# `python -m sei_omnigent.server.serve_main`), bypassing omnigent's stock
# entrypoint.py LOCAL_SINGLE_USER auto-set (C3).
[project.scripts]
sei-omnigent-serve = "sei_omnigent.server.serve_main:main"
# The standing omnigent-host launcher (PLT-715): installs the proxy-bearer patch (B1) then runs
# `omnigent host` in-process. The walle host Deployment uses it (or `python -m sei_omnigent.host_launch`).
sei-omnigent-host = "sei_omnigent.host_launch:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sei_omnigent*"]

# --- Lint / test enforcement (PLT refinement PR-2) -------------------------
# The standard existed (the ~/.claude language-pack-python.md) but nothing RAN
# it on the overlay. This wires ruff + pytest; a GitHub workflow gates PRs.
[tool.ruff]
line-length = 99  # mirror omnigent's parent config
target-version = "py312"  # matches requires-python (overlay has no async/old-alias UP targets)

[tool.ruff.lint]
# MVP enforcement set: pycodestyle/pyflakes baseline (E/F), pyupgrade (UP),
# bugbear latent-bug catches (B), ruff-specific incl. RUF100 unused-noqa (RUF).
# PLC0415 + S104 are selected so the overlay's documented deferred-import /
# bind-all-interfaces suppressions stay valid (else RUF100 flags them as unused).
#
# DEFERRED:
#  - `I` (import sorting) — ruff's isort fights the overlay's DELIBERATE import
#    structure: `_omnigent_shim.py` purpose-groups its re-exports under section
#    comments (the single-coupling-surface layout), which alphabetical isort
#    would scatter. Un-defer once isort is configured to preserve that (a
#    per-file-ignore for the shim + verified member order on the test imports) —
#    needs a local `ruff --fix` to land cleanly.
#  - `ANN` + a mypy type gate — un-defer at the first Phase-2 store swap, where a
#    seam type mis-bind becomes a real boot risk.
#  - `D` (docstrings) — un-defer at an external consumer.
# Expand toward omnigent's full parent select as the overlay grows.
select = ["E", "F", "UP", "B", "RUF", "PLC0415", "S104"]
ignore = [
    # The overlay's docstrings use typographic — / × / › intentionally (prose,
    # not ASCII-confusable source). Mirror omnigent's parent rationale.
    "RUF001",
    "RUF002",
    "RUF003",
    # `__all__` is grouped by PURPOSE, not alphabetized — the shim's public vs
    # private-cli sections, policies' functions-then-constant. Intentional; the
    # grouping is the readability contract. (Re-evaluate with `I` above.)
    "RUF022",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
