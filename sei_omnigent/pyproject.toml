[project]
name = "sei-omnigent"
version = "0.1.0"
description = "Sei's out-of-tree Omnigent overlay — the store/identity seam (Sei Agentic Mesh, design #11)"
requires-python = ">=3.12"

# Pin Omnigent EXACTLY. The overlay clones part of Omnigent's serve boot
# sequence (DECISION-1 / _omnigent_shim), so it is only verified against this
# exact release. Bumping this pin is the trigger to re-run the shim drift check.
dependencies = [
    "omnigent==0.1.1",
]

# Test deps. The pure overlay tests (seam/posture/policy/harness) run without an
# omnigent install (the omnigent-touching paths are AST-guarded / skip-if-absent),
# so `pip install .[test]` is enough for the unit suite. `pytest` is declared
# here because the suite now imports it as a library (pytest.raises), not just as
# the collector.
[project.optional-dependencies]
test = [
    "pytest>=7",
]

# The runnable entrypoint (PLT-672): config load + read-only-policy merge +
# uvicorn bind. The K8s deploy uses it as the container command (equivalently
# `python -m sei_omnigent.server.serve_main`), bypassing omnigent's stock
# entrypoint.py LOCAL_SINGLE_USER auto-set (C3).
[project.scripts]
sei-omnigent-serve = "sei_omnigent.server.serve_main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sei_omnigent*"]
