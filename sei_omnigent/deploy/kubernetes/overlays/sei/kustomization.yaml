# Sei overlay — carries the env-specifics. The base stays reusable; everything
# environment-bound lives here or in the secrets backend (SealedSecrets/
# ExternalSecrets, NOT in this repo).
#
# After cross-review + the human one-way-door checkpoint, an operator fills the
# PLACEHOLDER_* values (see README's table) — many live inside the base manifest
# bodies (NetworkPolicy CIDRs, config emails, the arm script) and are edited
# there or patched here. The image tag is pinned here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: PLACEHOLDER_NAMESPACE

# DESCRIPTIVE labels only — includeSelectors:false so these do NOT pollute
# podSelectors / NetworkPolicy peer selectors (esp. the foreign kube-dns peer in
# allow-dns-egress). Selectors stay on the bare `app:` key. `labels:` replaces
# the deprecated `commonLabels:`.
labels:
  - pairs:
      app.kubernetes.io/instance: sei-omnigent-prod
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

resources:
  - ../../base

# Pin the image once here (PINNED tag/sha, never :latest). Applies to the
# server, host, arm Job and re-arm CronJob (all share the omnigent image).
images:
  - name: PLACEHOLDER_IMAGE
    newName: PLACEHOLDER_IMAGE
    newTag: PLACEHOLDER_TAG

# Secrets are NOT generated here — provision via SealedSecrets/ExternalSecrets.
# If you must use a secretGenerator for a non-prod spike, add it here and keep
# the material out of git. See README.

# Env-specific PLACEHOLDER fills that are simplest as patches (rather than
# editing base bodies) can go here, e.g.:
# patches:
#   - path: server-config-patch.yaml   # admins / allowed_domains / DSN
#   - path: networkpolicy-cidrs-patch.yaml
