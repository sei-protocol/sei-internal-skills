# Least-privilege RBAC for the arm Job + re-arm CronJob. The ServiceAccount may
# get/patch/update ONLY the omnigent-host-token Secret by name — nothing else in
# the namespace, and crucially NO `create` (which K8s cannot scope by
# resourceName, so granting it would allow creating ARBITRARY Secrets).
#
# PREREQUISITE: the `omnigent-host-token` Secret MUST be pre-provisioned (empty
# data is fine — the arm Job populates it via update/patch) BEFORE the arm Job
# runs. Provision it in the secrets step (SealedSecrets/ExternalSecrets, or a
# placeholder Secret). The arm script update-path then rotates it in place. If
# the Secret is absent, the arm Job fails closed (403 on the would-be create) —
# loud, not silent.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: omnigent-host-arm
  labels:
    app: omnigent-host
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: omnigent-host-arm
  labels:
    app: omnigent-host
rules:
  # get/patch/update on the named Secret ONLY (arm + re-arm rotate it in place).
  # No `create` — the Secret is pre-provisioned (see header); this keeps the
  # grant truly scoped to the single Secret, which `create` could not be.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["omnigent-host-token"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: omnigent-host-arm
  labels:
    app: omnigent-host
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: omnigent-host-arm
subjects:
  - kind: ServiceAccount
    name: omnigent-host-arm
