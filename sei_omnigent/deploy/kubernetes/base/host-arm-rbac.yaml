# Least-privilege RBAC for the arm Job + re-arm CronJob. The ServiceAccount may
# patch (rotate) ONLY the omnigent-host-token Secret by name — nothing else in
# the namespace. resourceNames pins it to the single Secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: omnigent-host-arm
  labels:
    app: omnigent-host
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: omnigent-host-arm
  labels:
    app: omnigent-host
rules:
  # create: first-arm when the Secret does not yet exist.
  # get/patch/update on the named Secret only: re-arm overwrite.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["omnigent-host-token"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: omnigent-host-arm
  labels:
    app: omnigent-host
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: omnigent-host-arm
subjects:
  - kind: ServiceAccount
    name: omnigent-host-arm
