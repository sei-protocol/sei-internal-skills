# oauth2-proxy as the INGRESS BACKEND (not auth-url annotations). This is the
# load-bearing trust boundary: it validates the Sei IdP session and, via
# --pass-user-headers=true, SETS X-Forwarded-Email on the upstream request from
# the VERIFIED IdP claim, OVERWRITING any client-supplied inbound value (the
# strip). The server reads X-Forwarded-Email verbatim (auth.py:353) — an
# un-overwritten header = total impersonation, including admin.
#
# Why backend, not annotation: auth-url/auth-signin annotations leave the app
# itself L7-routable behind the ingress; a backend proxy means the only thing
# the ingress can route to is the proxy. The L3 NetworkPolicy (server ingress
# only-from-proxy) is the complementary enforcement at the network layer.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  labels:
    app: oauth2-proxy
spec:
  replicas: 2 # stateless; HA is fine here (cookie-session, no in-memory map)
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
          # FIX 7 — container hardening atop pod-level runAsNonRoot + seccomp.
          # oauth2-proxy is a static binary with no rootfs writes.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          args:
            - --http-address=0.0.0.0:4180
            - --upstream=http://omnigent-server.PLACEHOLDER_NAMESPACE.svc.cluster.local:80
            - --provider=oidc
            - --oidc-issuer-url=$(OIDC_ISSUER_URL)
            - --email-domain=PLACEHOLDER_ALLOWED_DOMAIN
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --reverse-proxy=true # trust X-Forwarded-* FROM the ingress only
            - --pass-access-token=false
            - --pass-authorization-header=false
            - --skip-provider-button=true
            # THE impersonation control. --pass-user-headers=true is what sets
            # X-Forwarded-Email (+ -User / -Groups / -Preferred-Username) on the
            # upstream request FROM the validated session, and OVERWRITES any
            # client-supplied inbound value (the strip). The server
            # (omnigent auth.py:353) reads X-Forwarded-Email verbatim, so this
            # flag is the entire impersonation control.
            #   - Do NOT remove --pass-user-headers.
            #   - Do NOT add an nginx auth-url annotation (that bypasses the
            #     strip and leaves the app L7-routable).
            # --set-xauthrequest is intentionally ABSENT: it emits the
            # X-Auth-Request-* family used by the rejected nginx auth_url pattern
            # and is not what omnigent reads; keeping it would invite a future
            # "cleanup" that drops --pass-user-headers and silently breaks the
            # impersonation control. VERIFY the flag behavior against the pinned
            # oauth2-proxy version — see README cross-review item.
            - --pass-user-headers=true
          env:
            - name: OIDC_ISSUER_URL
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy
                  key: OIDC_ISSUER_URL
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy
                  key: OAUTH2_PROXY_CLIENT_ID
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy
                  key: OAUTH2_PROXY_CLIENT_SECRET
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth2-proxy
                  key: OAUTH2_PROXY_COOKIE_SECRET
          ports:
            - containerPort: 4180
              name: http
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
