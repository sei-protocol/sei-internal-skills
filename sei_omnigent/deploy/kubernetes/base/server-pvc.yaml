# Persistent /data for the server: admin-credentials, cookie-secret, the
# `admins` roster, allowed_domains, and artifacts all live under here
# (MUST-FIX(b)). Mounted at /data (parent), not /data/artifacts. Moving off
# /data later requires a data migration — one-way-door flag #5.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: omnigent-data
  labels:
    app: omnigent-server
spec:
  accessModes:
    - ReadWriteOnce # single-replica server; RWO is sufficient and matches Recreate
  storageClassName: PLACEHOLDER_STORAGECLASS
  resources:
    requests:
      storage: 20Gi
