# ────────────────────────────────────────────────────────────────────────────
# SECRET TEMPLATES — *.example. DO NOT COMMIT REAL SECRET MATERIAL.
#
# This file is a TEMPLATE only and is NOT referenced by any kustomization.yaml.
# In a real deploy, provision these via SealedSecrets or ExternalSecrets so the
# ciphertext (sealed) or a reference (external) is what lives in git — never the
# plaintext below. The PLACEHOLDER_* values mark what each Secret must carry.
#
# stringData is used for readability; a real SealedSecret/ExternalSecret will
# carry base64 data / a backend reference instead.
# ────────────────────────────────────────────────────────────────────────────

# Private GHCR pull credential (read:packages PAT). dockerconfigjson form.
---
apiVersion: v1
kind: Secret
metadata:
  name: omnigent-ghcr
  labels:
    app: omnigent
type: kubernetes.io/dockerconfigjson
stringData:
  # base64 of {"auths":{"ghcr.io":{"auth":"<b64(user:read-packages-PAT)>"}}}
  .dockerconfigjson: "PLACEHOLDER_GHCR_DOCKERCONFIGJSON"

# Managed host launch token. WRITTEN BY the arm Job/CronJob at runtime — this
# template exists only to document the shape. Do NOT pre-seed a real token here;
# the arm Job generates it (secrets.token_urlsafe(32)) and writes it. If you
# pre-create it (e.g. so the host pod can start before the first arm run), use a
# throwaway placeholder that the arm Job overwrites.
---
apiVersion: v1
kind: Secret
metadata:
  name: omnigent-host-token
  labels:
    app: omnigent-host
type: Opaque
stringData:
  OMNIGENT_HOST_TOKEN: "PLACEHOLDER_HOST_TOKEN_OVERWRITTEN_BY_ARM_JOB"

# oauth2-proxy OIDC + cookie secret. cookie-secret MUST be 16/24/32 random bytes
# base64-encoded (oauth2-proxy requirement) — generate with:
#   python -c 'import os,base64;print(base64.urlsafe_b64encode(os.urandom(32)).decode())'
---
apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy
  labels:
    app: oauth2-proxy
type: Opaque
stringData:
  OIDC_ISSUER_URL: "PLACEHOLDER_OIDC_ISSUER_URL"
  OAUTH2_PROXY_CLIENT_ID: "PLACEHOLDER_OIDC_CLIENT_ID"
  OAUTH2_PROXY_CLIENT_SECRET: "PLACEHOLDER_OIDC_CLIENT_SECRET"
  OAUTH2_PROXY_COOKIE_SECRET: "PLACEHOLDER_OAUTH2_COOKIE_SECRET"

# Postgres credentials. The password MUST match server-config.yaml's
# database_uri. DATABASE_URI is the full DSN the arm/re-arm Jobs consume via
# secretKeyRef (FIX 4) — no plaintext password in pod env. Keep all of these in
# sync with the password above (or move to a managed DSN — see README).
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres
  labels:
    app: postgres
type: Opaque
stringData:
  POSTGRES_DB: "omnigent"
  POSTGRES_USER: "omnigent"
  POSTGRES_PASSWORD: "PLACEHOLDER_PG_PASSWORD"
  # Full DSN consumed by the arm/re-arm Jobs (OMNIGENT_DATABASE_URI). Must encode
  # the same POSTGRES_PASSWORD above.
  DATABASE_URI: "postgresql+psycopg://omnigent:PLACEHOLDER_PG_PASSWORD@postgres:5432/omnigent"
