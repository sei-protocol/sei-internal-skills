# 443/TLS → oauth2-proxy (NOT → omnigent-server). Routing to the server
# directly would bypass the strip+reset of X-Forwarded-Email = impersonation.
# proxy-buffering off + high timeouts for long-lived WS/SSE (the SPA streams
# tokens over SSE and the runner tunnel is a long WebSocket).
#
# Annotations below are nginx-ingress spelling; if PLACEHOLDER_INGRESSCLASS is
# not nginx, translate the buffering/timeout annotations to that controller's
# equivalents (this is a cross-review item).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: omnigent
  labels:
    app: omnigent-server
  annotations:
    cert-manager.io/cluster-issuer: PLACEHOLDER_TLS_ISSUER
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    # Defense-in-depth identity-header strip at the INGRESS edge, BEFORE the
    # request reaches oauth2-proxy. oauth2-proxy already overwrites these via
    # --pass-user-headers, but clearing them here means the strip does not rely
    # solely on oauth2-proxy's injector surviving a version bump. nginx-specific
    # (more_clear_input_headers); translate for the real PLACEHOLDER_INGRESSCLASS
    # if not nginx.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_clear_input_headers "X-Forwarded-Email" "X-Forwarded-User" "X-Forwarded-Groups" "X-Forwarded-Preferred-Username" "X-Auth-Request-Email" "X-Auth-Request-User" "X-Auth-Request-Groups";
spec:
  ingressClassName: PLACEHOLDER_INGRESSCLASS
  tls:
    - hosts:
        - PLACEHOLDER_HOSTNAME
      secretName: omnigent-tls
  rules:
    - host: PLACEHOLDER_HOSTNAME
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oauth2-proxy # NEVER omnigent-server
                port:
                  number: 80
