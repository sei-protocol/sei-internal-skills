# Headless Service for the Postgres StatefulSet. Stable DNS `postgres:5432`
# (and `postgres-0.postgres`) for the server's database_uri. ClusterIP:None →
# the server-config DSN host `postgres` resolves to the pod directly.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
