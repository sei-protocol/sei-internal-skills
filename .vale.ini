# The writing contract, checked by Vale. The rules live in writing/styles and this
# file decides where each one applies.
#
# WHICH RULES RUN DEPENDS ON WHERE A FILE SITS. A prose rule applies everywhere. A
# structure rule applies only on the path whose structure it describes, so it is
# disabled in [*.md] and enabled again in the section for its mode. A rule that
# demands a Consequences section has no business on a README.
#
#
# Reference: https://vale.sh/docs/keys/

StylesPath = writing/styles

# Fetched by `vale sync`, not committed. See .gitignore. proselint is not here:
# nothing names it in a BasedOnStyles, so it would download to be ignored.
Packages = write-good

MinAlertLevel = suggestion

Vocab = AgenticWriting

[*.md]
BasedOnStyles = Vale, AgenticWriting, write-good


# write-good overlaps with the STE rules below. Keep one owner per concern.
write-good.Passive = NO
write-good.TooWordy = NO

# The ADR section rules describe an ADR, not prose in general. A README has no
# '## Decision' heading and that is not a defect. See [docs/adr/*.md] below.

# Writing-mode structure rules. Each one describes one mode and turns on only
# on that mode's path, in the sections at the end of this file. A missing
# '## Trade-offs' is a defect in a design document and meaningless in a README.
AgenticWriting.EARS-CriterionShall = NO
AgenticWriting.Spec-AcceptanceCriteria = NO
AgenticWriting.Design-Arc42Order = NO

# The 20-word limit is the procedure limit. Ordinary prose uses the 25-word
# description limit, so this rule stays off outside docs/procedures. The rule
# file already says so; without this line it ran on every Markdown file and
# reported a second finding on every sentence the description rule caught.
# Writing-mode structure rules, generated from writing/scripts/modes.yaml. Each
# describes one mode and turns on only on that mode's path, in the sections at
# the end of this file. A missing '## Trade-offs' is a defect in a design
# document and meaningless in a README.
AgenticWriting.ADR-Status = NO
AgenticWriting.ADR-Context = NO
AgenticWriting.ADR-Decision = NO
AgenticWriting.ADR-Consequences = NO
AgenticWriting.Spec-Anchors = NO
AgenticWriting.Spec-SuccessCriteria = NO
AgenticWriting.Spec-IndependentTest = NO
AgenticWriting.Ticket-Problem = NO
AgenticWriting.Ticket-Impact = NO
AgenticWriting.Ticket-RelevantExperts = NO
AgenticWriting.Ticket-ProposedApproach = NO
AgenticWriting.Ticket-AcceptanceCriteria = NO
AgenticWriting.Ticket-OutOfScope = NO
AgenticWriting.Ticket-References = NO
AgenticWriting.Design-NonGoals = NO
AgenticWriting.Design-Alternatives = NO
AgenticWriting.Design-Tradeoffs = NO
AgenticWriting.Design-OpenQuestions = NO

AgenticWriting.STE-SentenceLength-Procedure = NO

# ASD-STE100's imperative rule governs a procedure step. A descriptive bullet is
# not a step, and 'Replacing X' in a Non-goals list is correct English. Measured
# on four documents in this repository before scoping it: every hit outside a
# procedure was a false positive, and the design mode *requires* a Non-goals
# section, so leaving it global made two rules here contradict each other.
AgenticWriting.STE-Gerund-Instruction = NO

# RFC 2119 applies to specifications, design documents, and protocol documents.
# See applies_to for the rfc2119 anchor in anchors/registry.yaml. In ordinary
# prose "you may quote this" is not a permission grant, so the rule is off here
# and on under [specs/**/*.md].
AgenticWriting.RFC2119-Keywords = NO

# E-Prime flags every form of "to be". STE-Passive already owns that concern,
# and this file keeps one owner per concern.
write-good.E-Prime = NO

# A fixture sits on the path whose rules it exercises, so each mode's section
# names its fixture directory beside the real one. A rule scoped to specs/
# cannot be tested from anywhere else.

# Prose rules cover every file in a feature directory.
[{specs/**/*.md,writing/evals/fixtures/specs/**/*.md}]
BasedOnStyles = Vale, AgenticWriting

# The normative contract covers spec.md alone. Spec Kit puts plan.md,
# research.md, data-model.md, quickstart.md, tasks.md and contracts/ beside it,
# and none of those is a specification. A plan that writes "the source may
# address a second endpoint" describes a design, so uppercasing MAY there would
# assert something the plan does not mean. A plan is not missing a Semantic
# Anchors block either.
[{specs/**/spec.md,writing/evals/fixtures/specs/**/spec.md}]
# The level stays here, not YES: the rule file defaults to warning and a
# specification needs the error gate. Vale applies a level assignment globally,
# which is harmless because the rule is disabled outside this scope.
AgenticWriting.RFC2119-Keywords = error

# Spec Kit structure, plus this repository's anchor-block delta.
AgenticWriting.EARS-CriterionShall = YES
AgenticWriting.Spec-AcceptanceCriteria = YES
AgenticWriting.Spec-Anchors = YES
AgenticWriting.Spec-SuccessCriteria = YES
AgenticWriting.Spec-IndependentTest = YES

# Procedures use the tighter sentence limit. See anchors/asd-ste100.md.
[{docs/procedures/**/*.md,writing/evals/fixtures/procedures/**/*.md}]
AgenticWriting.STE-SentenceLength-Procedure = YES
AgenticWriting.STE-SentenceLength-Description = NO
AgenticWriting.STE-Gerund-Instruction = YES

# ADR (Nygard): all four sections are mandatory in an ADR.
#
# The descriptive sentence cap comes off here, and on the design paths below.
# ASD-STE100 was built for maintenance procedures, whose reader executes a step
# rather than follows an argument. An ADR and a design document carry reasoning,
# and reasoning travels through subordination: because, so that, which would
# mean, unless. Capping the sentence forces a split, and a split drops the
# connective that was carrying the causal link. ADR 0002 records the evidence.
#
# STE keeps its diction rules on these paths. Approved words, active voice, one
# word in one meaning, and noun-cluster limits all serve reasoning prose, and
# consistent terminology matters more in a specification than in a runbook.
[{docs/adr/*.md,writing/evals/fixtures/adr/*.md}]
AgenticWriting.ADR-Status = YES
AgenticWriting.ADR-Context = YES
AgenticWriting.ADR-Decision = YES
AgenticWriting.ADR-Consequences = YES
AgenticWriting.STE-SentenceLength-Description = NO


# Design mode. Four sections that go missing when a document is rushed, plus the
# arc42 order check. The four are this repository's own contract, not arc42's --
# arc42 defines none of them. Arc42Order is the arc42 anchor's only verifier.
[{docs/design/**/*.md,designs/**/*.md,writing/evals/fixtures/design/**/*.md}]
AgenticWriting.Design-Arc42Order = YES
AgenticWriting.Design-NonGoals = YES
AgenticWriting.Design-Alternatives = YES
AgenticWriting.Design-Tradeoffs = YES
AgenticWriting.Design-OpenQuestions = YES
AgenticWriting.STE-SentenceLength-Description = NO

# Ticket mode. A ticket body is not a file in this repository, so a tool that
# files one stages the rendered body under tickets/ and lints it before filing.
# That is how an agent validates its own output instead of asserting it is fine.
[{tickets/**/*.md,writing/evals/fixtures/tickets/**/*.md}]
BasedOnStyles = Vale, AgenticWriting
AgenticWriting.Ticket-Problem = YES
AgenticWriting.Ticket-Impact = YES
AgenticWriting.Ticket-RelevantExperts = YES
AgenticWriting.Ticket-ProposedApproach = YES
AgenticWriting.Ticket-AcceptanceCriteria = YES
AgenticWriting.Ticket-OutOfScope = YES
AgenticWriting.Ticket-References = YES
