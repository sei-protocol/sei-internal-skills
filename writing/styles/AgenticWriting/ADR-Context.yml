# GENERATED by scripts/generate-mode-rules.py from scripts/modes.yaml. Do not edit.
# ADR (Nygard): an ADR records Title, Status, Context, Decision, Consequences.
# Vale checks presence only; the quality of the section is in the not_checkable
# list for adr-nygard in anchors/registry.yaml.
#
# This is a script rule rather than an occurrence count. It needs scope: raw to see
# document structure, and raw text does not distinguish a heading from a heading
# quoted inside a fenced code block. As an occurrence rule it counted the quoted one,
# so a document that merely showed the required format passed. The templates and
# docs/writing-modes.md both quote these headings, so this was not hypothetical.
#
# Presence only. Vale cannot judge whether the section says anything.
#
# Known error mode: any fence marker toggles the flag, so a ``` inside a ~~~ block
# closes it early and a heading after that point counts. An unclosed fence hides
# every heading below it, which makes the rule fire rather than go quiet.
#
# Scoped to docs/adr in .vale.ini. Without that scope it fires on every file.
extends: script
message: "ADR is missing a '## Context' section."
level: error
scope: raw
script: |
  text := import("text")
  matches := []
  in_fence := false
  found := false
  lines := text.split(scope, "\n")

  for line in lines {
    // A Tengo raw string is backtick-delimited, so a pattern holding a backtick
    // cannot be one literal. The runs are spliced back in as quoted strings.
    if text.re_match(`^[ ]{0,3}(?:`+"```"+`|~~~)`, line) {
      in_fence = !in_fence
    } else if !in_fence {
      if text.re_match(`(?i)^[ ]{0,3}#+[ \t]+Context\b`, line) {
        found = true
      }
    }
  }

  // Report against the first line. Tengo's len() counts bytes, which is what Vale
  // wants for a span, and an empty first line still needs a non-zero one.
  if !found {
    span := len(lines[0])
    if span == 0 { span = 1 }
    matches = append(matches, {begin: 0, end: span})
  }
