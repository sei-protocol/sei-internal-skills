# Global Vale configuration. Vale uses this only when no repository .vale.ini
# is found by searching upward from the working directory.
#
# The rules are NOT copied here. styles/AgenticWriting and styles/config are
# symlinks to $AGENTIC_WRITING_HOME, which stays canonical. Edit the rules
# there.
#
# Reference: https://vale.sh/docs/keys/

# Relative to this file's own directory, so the same config works for every
# user on both macOS and Linux. An absolute path here worked on one laptop and
# named that user in the error everyone else saw.
StylesPath = styles

Packages = write-good

MinAlertLevel = suggestion

Vocab = AgenticWriting

[*.md]
BasedOnStyles = Vale, AgenticWriting, write-good

# One owner per concern. STE-Passive owns the be-verb.
write-good.Passive = NO
write-good.TooWordy = NO
write-good.E-Prime = NO

# A global spell check has no project vocabulary, so it reports every
# identifier and product name in every repository. Spelling belongs to the
# repository that can define its own accept list.
Vale.Spelling = NO

# These rules describe a document type, not prose in general. Each one turns
# on below, on the path where that document type lives.
AgenticWriting.ADR-Status = NO
AgenticWriting.ADR-Context = NO
AgenticWriting.ADR-Decision = NO
AgenticWriting.ADR-Consequences = NO
AgenticWriting.STE-SentenceLength-Procedure = NO

# ASD-STE100's imperative rule governs a procedure step, not a descriptive
# bullet. On in docs/procedures only.
AgenticWriting.STE-Gerund-Instruction = NO
AgenticWriting.RFC2119-Keywords = NO

# Writing-mode structure rules. Each describes one mode and turns on only on
# that mode's path, in the sections at the end of this file.
AgenticWriting.Spec-Anchors = NO
AgenticWriting.Spec-SuccessCriteria = NO
AgenticWriting.Spec-IndependentTest = NO
AgenticWriting.Ticket-Problem = NO
AgenticWriting.Ticket-Impact = NO
AgenticWriting.Ticket-RelevantExperts = NO
AgenticWriting.Ticket-ProposedApproach = NO
AgenticWriting.Ticket-AcceptanceCriteria = NO
AgenticWriting.Ticket-OutOfScope = NO
AgenticWriting.Ticket-References = NO
AgenticWriting.Design-Arc42Order = NO
AgenticWriting.Design-NonGoals = NO
AgenticWriting.Design-Alternatives = NO
AgenticWriting.Design-Tradeoffs = NO
AgenticWriting.Design-OpenQuestions = NO

# RFC 2119 and the structural rules both apply to the specification itself, not
# to its siblings. Spec Kit puts plan.md, research.md, data-model.md,
# quickstart.md, tasks.md and contracts/ beside spec.md, and only spec.md is a
# specification. A plan that writes "the source may address a second endpoint"
# is describing a design, not stating a requirement, so uppercasing MAY there
# would assert something the plan does not mean.
[specs/**/spec.md]
AgenticWriting.RFC2119-Keywords = error
AgenticWriting.Spec-Anchors = YES
AgenticWriting.Spec-SuccessCriteria = YES
AgenticWriting.Spec-IndependentTest = YES

# A procedure uses the 20-word limit instead of the 25-word limit.
[docs/procedures/**/*.md]
AgenticWriting.STE-SentenceLength-Procedure = YES
AgenticWriting.STE-SentenceLength-Description = NO
AgenticWriting.STE-Gerund-Instruction = YES

# An ADR needs all four Nygard sections.
#
# The descriptive sentence cap comes off here, and on the design paths below.
# ASD-STE100 was built for maintenance procedures, whose reader is executing a
# step rather than following an argument. A design document and an ADR carry
# reasoning, and reasoning travels through subordination: because, so that,
# which would mean, unless. Capping the sentence forces a split, and a split
# drops the connective that was carrying the causal link.
#
# STE keeps its diction rules everywhere. Approved words, active voice, one word
# in one meaning, and noun-cluster limits all apply to reasoning prose, and the
# terminology rule matters more in a specification than in a runbook.
[docs/adr/*.md]
AgenticWriting.ADR-Status = YES
AgenticWriting.ADR-Context = YES
AgenticWriting.ADR-Decision = YES
AgenticWriting.ADR-Consequences = YES
AgenticWriting.STE-SentenceLength-Description = NO

# Ticket mode. /linear-ticket stages a rendered body under tickets/ and lints it
# before it files anything.
[tickets/**/*.md]
AgenticWriting.Ticket-Problem = YES
AgenticWriting.Ticket-Impact = YES
AgenticWriting.Ticket-RelevantExperts = YES
AgenticWriting.Ticket-ProposedApproach = YES
AgenticWriting.Ticket-AcceptanceCriteria = YES
AgenticWriting.Ticket-OutOfScope = YES
AgenticWriting.Ticket-References = YES

# Design mode. The four sections that go missing when a document is rushed.
[{docs/design/**/*.md,designs/**/*.md}]
AgenticWriting.Design-Arc42Order = YES
AgenticWriting.Design-NonGoals = YES
AgenticWriting.Design-Alternatives = YES
AgenticWriting.Design-Tradeoffs = YES
AgenticWriting.Design-OpenQuestions = YES
AgenticWriting.STE-SentenceLength-Description = NO
