# Vale configuration, installed by agentic-writing.
#
#   curl -fsSL https://raw.githubusercontent.com/sei-protocol/sei-internal-skills/@REF@/writing/scripts/install.sh \
#     | bash -s -- repo
#
# That URL carries the same ref as the workflow. An unpinned one would install a
# different rule set than CI runs, which is the disagreement the pin exists to
# stop.
#
# The rules are not in this repository. CI fetches them at the ref below, and
# `.vale/` is gitignored. One source of truth, and a pin so the fetch is
# reproducible. Raise the pin deliberately, and expect new findings when you do.
#
# Locally, the installer fetched the rules into .vale/styles for you. Re-run it
# to refresh them.
#
# Run `vale --no-global docs/ specs/` locally. Vale merges a user-level config
# into this one when it finds one, and a CI runner has none, so a plain `vale`
# on a laptop can enforce a different rule set than CI does. The flag exists
# because the merge does. CI passes --no-global for the same reason.

StylesPath = .vale/styles

# Lint document paths, not the whole tree. `vale .` reads .vale/styles as well
# and reports findings in the fetched packages' own README files. Name the
# paths instead:
#
#     vale docs/ specs/ tickets/

# proselint was here and nothing used it. Vale runs a style only when a
# BasedOnStyles names it or a proselint.<Rule> key appears, and neither did, so
# every run downloaded it to ignore it. Add it back the same day you enable it.
Packages = write-good

MinAlertLevel = suggestion

# Two vocabularies. AgenticWriting travels with the rules and is overwritten on
# every install, so it is not yours to edit. This repository's own accepted
# terms live in .vale/vocab/accept.txt, which is committed. The installer and CI
# copy it to where Vale reads a vocabulary, inside the overwritten tree.
#
# SEED IT WITH YOUR HYPHENATED IDENTIFIERS. Vale reads a Markdown file's YAML
# frontmatter as prose, so `name: my-thing-specialist` is checked like a
# sentence. A repository of Claude Code skills or agents hits this on every
# file. Nothing else suppresses it: TokenIgnores and BlockIgnores were tried in
# three forms and none work.
#
# HYPHENATED ONLY. A vocabulary entry is not a permission, it is the one correct
# casing, and Vale.Terms reports every other form. Seeding a real repository with
# bare words such as `evm` and `design` took it from 40 findings to 636, because
# every `EVM` and every sentence-initial `Design` became an error. A hyphenated
# identifier has no competing form and is safe.
Vocab = AgenticWriting, Local

# agentic-writing ref this repository is pinned to: @REF@

[*.md]
BasedOnStyles = Vale, AgenticWriting, write-good

# One owner per concern. STE-Passive owns the be-verb.
write-good.Passive = NO
write-good.TooWordy = NO
write-good.E-Prime = NO

# A global spell check reports every identifier and product name. Spelling
# belongs to a repository that can define its own accept list.
Vale.Spelling = NO

# These describe a document type, not prose in general. Each turns on below, on
# the path where that document type lives.
AgenticWriting.ADR-Status = NO
AgenticWriting.ADR-Context = NO
AgenticWriting.ADR-Decision = NO
AgenticWriting.ADR-Consequences = NO
AgenticWriting.STE-SentenceLength-Procedure = NO
AgenticWriting.STE-Gerund-Instruction = NO
AgenticWriting.RFC2119-Keywords = NO
AgenticWriting.Spec-Anchors = NO
AgenticWriting.Spec-SuccessCriteria = NO
AgenticWriting.Spec-IndependentTest = NO
AgenticWriting.Ticket-Problem = NO
AgenticWriting.Ticket-Impact = NO
AgenticWriting.Ticket-RelevantExperts = NO
AgenticWriting.Ticket-ProposedApproach = NO
AgenticWriting.Ticket-AcceptanceCriteria = NO
AgenticWriting.Ticket-OutOfScope = NO
AgenticWriting.Ticket-References = NO
AgenticWriting.Design-NonGoals = NO
AgenticWriting.Design-Alternatives = NO
AgenticWriting.Design-Tradeoffs = NO
AgenticWriting.Design-OpenQuestions = NO
AgenticWriting.Design-Arc42Order = NO
AgenticWriting.EARS-CriterionShall = NO
AgenticWriting.Spec-AcceptanceCriteria = NO

# RFC 2119 applies to a specification, not to ordinary prose. Spec Kit puts
# plan.md and its siblings beside spec.md, and only spec.md is a specification.
[specs/**/*.md]
AgenticWriting.RFC2119-Keywords = error

[specs/**/spec.md]
AgenticWriting.Spec-Anchors = YES
AgenticWriting.Spec-SuccessCriteria = YES
AgenticWriting.Spec-IndependentTest = YES
AgenticWriting.Spec-AcceptanceCriteria = YES
AgenticWriting.EARS-CriterionShall = YES

# A procedure uses the 20-word limit instead of the 25-word limit.
[docs/procedures/**/*.md]
AgenticWriting.STE-SentenceLength-Procedure = YES
AgenticWriting.STE-SentenceLength-Description = NO
AgenticWriting.STE-Gerund-Instruction = YES

# An ADR needs all four Nygard sections.
#
# The descriptive sentence cap comes off here, and on the design paths below.
# ASD-STE100 was built for maintenance procedures, whose reader executes a step
# rather than follows an argument. An ADR and a design document carry reasoning,
# and reasoning travels through subordination. Capping the sentence forces a
# split, and a split drops the connective carrying the causal link. ADR 0002 in
# agentic-writing records the evidence.
[docs/adr/*.md]
AgenticWriting.ADR-Status = YES
AgenticWriting.ADR-Context = YES
AgenticWriting.ADR-Decision = YES
AgenticWriting.ADR-Consequences = YES
AgenticWriting.STE-SentenceLength-Description = NO

# Ticket mode. A ticket body is not a file here, so a rendered body is staged
# under tickets/ and linted before anything is filed.
[tickets/**/*.md]
AgenticWriting.Ticket-Problem = YES
AgenticWriting.Ticket-Impact = YES
AgenticWriting.Ticket-RelevantExperts = YES
AgenticWriting.Ticket-ProposedApproach = YES
AgenticWriting.Ticket-AcceptanceCriteria = YES
AgenticWriting.Ticket-OutOfScope = YES
AgenticWriting.Ticket-References = YES

# Design mode. The four sections that go missing when a document is rushed.
[{docs/design/**/*.md,designs/**/*.md}]
AgenticWriting.Design-NonGoals = YES
AgenticWriting.Design-Alternatives = YES
AgenticWriting.Design-Tradeoffs = YES
AgenticWriting.Design-OpenQuestions = YES
AgenticWriting.Design-Arc42Order = YES
AgenticWriting.STE-SentenceLength-Description = NO
