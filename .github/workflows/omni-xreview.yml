name: omni-xreview

# Reviews a pull request with the sei-droid agent and posts the verdict as one
# comment. workflow_dispatch only; the promote-to-auto step is gated separately.
#
# The session lifecycle is the sei-agent-driver binary's, not this file's. What
# stays here is what a runner has to hold: the GitHub identity that reads the pull
# request and posts the comment, which never enters the sandbox.
#
# Runs on a hosted runner rather than the in-cluster fleet. The server is reachable
# at its gateway hostname over https, so nothing here needs to be inside the mesh,
# and a hosted image already ships gh and jq.

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Target repo (owner/name)"
        required: true
      pr:
        description: "PR number to review"
        required: true
      driver-version:
        description: "sei-agent-driver release tag; defaults to this repo's version.json"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: omni-xreview-${{ inputs.repo }}-${{ inputs.pr }}
  cancel-in-progress: true

jobs:
  xreview:
    runs-on: ubuntu-latest
    # Above the driver's own run deadline so a slow-but-valid review is never
    # hard-killed mid-turn, which would end it with no annotation saying why.
    timeout-minutes: 40
    env:
      OMNIGENT_BASE_URL: https://seigent.dev.platform.sei.io
      SEIDROID_AGENT_ID: sei-droid
      TARGET_REPO: ${{ inputs.repo }}
      TARGET_PR: ${{ inputs.pr }}

    steps:
      - uses: actions/checkout@v4

      # Validated here rather than trusted: both values are dispatch inputs, and
      # the token below is scoped by the owner and name split out of one of them.
      - name: Validate the target
        id: target
        run: |
          set -euo pipefail
          case "$TARGET_REPO" in
            */*/*|/*|*/) echo "::error::repo must be owner/name, got '$TARGET_REPO'"; exit 1 ;;
            */*) ;;
            *) echo "::error::repo must be owner/name, got '$TARGET_REPO'"; exit 1 ;;
          esac
          case "$TARGET_PR" in
            ''|*[!0-9]*) echo "::error::pr must be a number, got '$TARGET_PR'"; exit 1 ;;
          esac
          echo "owner=${TARGET_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${TARGET_REPO##*/}" >> "$GITHUB_OUTPUT"

      # The binary is a release asset of this repo, which is private, so the
      # download needs a credential. The job's own token is exactly scoped for it.
      # Checksummed because a release asset is mutable until someone decides it
      # is not, and an unverified binary is handed the M2M credential below.
      - name: Fetch the driver
        env:
          GH_TOKEN: ${{ github.token }}
          # Through the environment, not interpolated into the script. A dispatch
          # input reaching a shell as text is an injection, and this one is the last
          # input not validated above.
          DRIVER_VERSION: ${{ inputs.driver-version }}
        run: |
          set -euo pipefail
          tag="$DRIVER_VERSION"
          if [ -z "$tag" ]; then
            tag="$(jq -r '.version' version.json)"
          fi
          echo "driver $tag"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern 'sei-agent-driver_*_linux_amd64.tar.gz' --pattern 'checksums.txt' --dir .
          sha256sum --check --ignore-missing checksums.txt
          tar xzf sei-agent-driver_*_linux_amd64.tar.gz
          ./sei-agent-driver --version

      # Runner-side identity, and it stays runner-side: it reads the pull request
      # and posts the comment. The sandbox is a separate trust domain and gets none
      # of this.
      - name: Mint the GitHub App token
        id: apptoken
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.PLATFORM_CODE_AGENT_APP_ID }}
          private-key: ${{ secrets.PLATFORM_CODE_AGENT_APP_PK }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.name }}
          # Scoped explicitly. Without these the token carries every permission the
          # app holds on that repository, which is wider than reading a pull request
          # and posting one comment.
          permission-contents: read
          permission-pull-requests: write

      # The driver mints its own omnigent bearer from the M2M client. Passing the
      # client rather than a token keeps the credential out of a step output: a
      # minted token written to one is readable by every later step in the job.
      - name: Review
        id: review
        env:
          OMNIGENT_M2M_CLIENT_ID: sei-droid
          OMNIGENT_M2M_CLIENT_SECRET: ${{ secrets.OMNIGENT_M2M_CLIENT_SECRET }}
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
        run: |
          set -uo pipefail
          ./sei-agent-driver xreview "$TARGET_REPO" "$TARGET_PR" --out verdict.md
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          # Exit codes are the contract, so they are read rather than collapsed to
          # pass/fail. 0 is a verdict. Anything else that still wrote one is worth
          # posting with the code named; anything else is worth failing on.
          if [ "$rc" -ne 0 ] && [ ! -s verdict.md ]; then
            echo "::error::the driver produced no verdict (exit $rc)"
            exit "$rc"
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::warning::the driver exited $rc but produced a verdict; see the logs"
          fi

      # Fail-closed: only reached with a verdict on disk, so a broken run posts
      # nothing rather than a partial one.
      - name: Post the verdict
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
          EXIT_CODE: ${{ steps.review.outputs.exit_code }}
        run: |
          set -euo pipefail
          body="$(cat verdict.md)"
          if [ "$EXIT_CODE" != "0" ]; then
            body="$(printf '%s\n\n<sub>driver exit %s — this review may be incomplete.</sub>\n' \
              "$body" "$EXIT_CODE")"
          fi
          printf '%s' "$body" | gh pr comment "$TARGET_PR" --repo "$TARGET_REPO" --body-file -
