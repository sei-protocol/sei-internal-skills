name: omni-xreview

# Design-18 step 3 — the manual-trigger MVP driver for the GitHub-venue /xreview.
# Runs on the in-cluster dev ARC fleet (reaches the omnigent server ClusterIP),
# computes the PR's merge-base diff with full git, starts a MANAGED Kubernetes
# sandbox session against the pre-registered `xreview` agent, hands the diff in as
# the session's first message (the runner clones the head tree; the diff scopes
# the review), waits for the sentinel-terminated verdict, and posts it as an
# `omni-xreview` detail comment. workflow_dispatch only (no per-PR trigger) — the
# promote-to-auto step is gated (LLD #96). It NEVER writes to the PR beyond the one
# comment, and fails closed (no comment) rather than post a partial/forged verdict.

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Target repo (owner/name)"
        required: true
      pr:
        description: "PR number to review"
        required: true

permissions:
  contents: read       # checkout / diff of THIS repo; the App token does the target repo
  id-token: none

concurrency:
  # One review per (repo, PR) at a time — a re-trigger supersedes the in-flight run.
  group: omni-xreview-${{ inputs.repo }}-${{ inputs.pr }}
  cancel-in-progress: true

jobs:
  xreview:
    # The dev ARC scale set — in-cluster, so it can reach the server ClusterIP, and
    # the step-1 NetworkPolicy allows gha-runner -> the server on :8000.
    runs-on: uci-default
    timeout-minutes: 30
    env:
      SERVER: "http://omnigent.sei-omnigent.svc.cluster.local"
      # Header-auth identity (the server is OMNIGENT_AUTH_PROVIDER=header). The
      # server trusts this header in-cluster; it does NOT confer admin (header mode
      # mounts no accounts router). Session-create needs only an authenticated user.
      XFWD_EMAIL: "sei-omnigent@seinetwork.io"
      AGENT_NAME: "xreview"
      SENTINEL: "=== XREVIEW-VERDICT-END ==="
      REPO: ${{ inputs.repo }}
      PR: ${{ inputs.pr }}
    steps:
      # A GitHub App token scoped to the target repo — the workflow posts the one
      # comment as the app identity (the same mechanism omnigent's polly-review uses).
      # OPERATOR PREREQUISITE: configure vars.OMNIGENT_BOT_APP_ID + the private-key
      # secret on this repo (and install the app on the target repos). Absent → the
      # comment post fails and the run is red (fail-closed: no forged verdict posted).
      - name: Mint GitHub App token (target repo)
        id: apptoken
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.OMNIGENT_BOT_APP_ID }}
          private-key: ${{ secrets.OMNIGENT_BOT_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.repo }}

      # Compute the PR's merge-base diff with full git access (the sandbox CANNOT —
      # its clone is single-branch head, and its reviewer is deny_shell). This diff
      # is handed IN to the session as the trusted, driver-produced input; the bundle
      # reads it from the message (provenance-first, #250). FAIL CLOSED on an empty
      # diff: the managed driver MUST always hand in a non-empty diff, or the
      # bundle's precedence falls through to the attacker-controllable in-clone file
      # (the #250 security residual made a hard invariant here).
      - name: Compute merge-base diff + head branch
        id: diff
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
        run: |
          set -euo pipefail
          repo="${REPO#*/}"
          branch="$(gh pr view "$PR" --repo "$REPO" --json headRefName -q .headRefName)"
          if [ -z "$branch" ]; then echo "::error::could not resolve PR head branch"; exit 1; fi
          gh pr diff "$PR" --repo "$REPO" > pr.diff
          if [ ! -s pr.diff ]; then
            echo "::error::empty merge-base diff — refusing to dispatch (would fall through to the in-clone file; #250 invariant)"
            exit 1
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "workspace=https://github.com/${REPO}#${branch}" >> "$GITHUB_OUTPUT"
          echo "diff bytes: $(wc -c < pr.diff), head branch: $branch"

      - name: Resolve the xreview agent id
        id: agent
        run: |
          set -euo pipefail
          aid="$(curl -fsS -H "X-Forwarded-Email: ${XFWD_EMAIL}" "${SERVER}/v1/agents" \
            | jq -r --arg n "$AGENT_NAME" '.data[] | select(.name==$n) | .id' | head -n1)"
          if [ -z "$aid" ] || [ "$aid" = "null" ]; then
            echo "::error::agent '${AGENT_NAME}' not registered on the server (GET /v1/agents) — check OMNIGENT_BUILTIN_AGENT_DIRS on the dev deploy"
            exit 1
          fi
          echo "agent_id=$aid" >> "$GITHUB_OUTPUT"
          echo "resolved agent_id=$aid"

      - name: Create the managed sandbox session
        id: session
        run: |
          set -euo pipefail
          body="$(jq -n \
            --arg aid "${{ steps.agent.outputs.agent_id }}" \
            --arg ws "${{ steps.diff.outputs.workspace }}" \
            --arg title "omni-xreview ${REPO}#${PR}" \
            '{agent_id:$aid, host_type:"managed", workspace:$ws, title:$title}')"
          sid="$(curl -fsS -X POST -H "Content-Type: application/json" \
            -H "X-Forwarded-Email: ${XFWD_EMAIL}" \
            -d "$body" "${SERVER}/v1/sessions" | jq -r '.id')"
          if [ -z "$sid" ] || [ "$sid" = "null" ]; then echo "::error::session create returned no id"; exit 1; fi
          echo "session_id=$sid" >> "$GITHUB_OUTPUT"
          echo "session=$sid"

      # Cold-start-aware wait: a managed session provisions a Karpenter node
      # (scale-from-zero) + schedules the pod + init-clones the repo + connects the
      # host tunnel. Budget generously; poll sandbox_status.stage.
      - name: Wait for the sandbox to be ready
        run: |
          set -euo pipefail
          sid="${{ steps.session.outputs.session_id }}"
          for i in $(seq 1 60); do   # 60 x 10s = 10 min cold-start budget
            resp="$(curl -fsS -H "X-Forwarded-Email: ${XFWD_EMAIL}" "${SERVER}/v1/sessions/${sid}")"
            stage="$(echo "$resp" | jq -r '.sandbox_status.stage // "unknown"')"
            echo "stage=$stage"
            case "$stage" in
              ready) echo "sandbox ready"; exit 0 ;;
              failed) echo "::error::sandbox failed: $(echo "$resp" | jq -r '.sandbox_status.error // "unknown"')"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::sandbox did not reach ready within the cold-start budget"
          exit 1

      # Hand the diff in as the FIRST message — this both delivers the trusted,
      # driver-produced diff (the bundle reads the initial message per #250) and
      # triggers the agent's first turn.
      - name: Send the diff (first message) to trigger the review
        run: |
          set -euo pipefail
          sid="${{ steps.session.outputs.session_id }}"
          body="$(jq -n --rawfile d pr.diff \
            '{type:"message", data:{role:"user", content:[{type:"input_text", text:$d}]}}')"
          curl -fsS -X POST -H "Content-Type: application/json" \
            -H "X-Forwarded-Email: ${XFWD_EMAIL}" \
            -d "$body" "${SERVER}/v1/sessions/${sid}/events" >/dev/null
          echo "diff delivered"

      # Poll for the sentinel-terminated verdict. The review dispatches a blinded
      # slate of subagents, so allow generous time. N2: trust the verdict ONLY if the
      # sentinel is present (a truncated/interrupted run has no sentinel → fail closed).
      - name: Retrieve the verdict (sentinel-gated)
        id: verdict
        run: |
          set -euo pipefail
          sid="${{ steps.session.outputs.session_id }}"
          for i in $(seq 1 80); do   # 80 x 15s = 20 min review budget
            resp="$(curl -fsS -H "X-Forwarded-Email: ${XFWD_EMAIL}" "${SERVER}/v1/sessions/${sid}")"
            status="$(echo "$resp" | jq -r '.status')"
            # latest assistant message text (concatenate its text blocks)
            text="$(echo "$resp" | jq -r '[.items[] | select(.type=="message" and .role=="assistant")] | last | (.content // []) | map(.text // "") | join("")')"
            if [ -n "$text" ] && printf '%s' "$text" | grep -qF "${SENTINEL}"; then
              printf '%s' "$text" > verdict.md
              echo "verdict retrieved (sentinel present)"
              exit 0
            fi
            if [ "$status" = "failed" ]; then echo "::error::session failed before a sentinel-terminated verdict"; exit 1; fi
            sleep 15
          done
          echo "::error::no sentinel-terminated verdict within budget — failing closed, NO comment posted"
          exit 1

      # Post the verdict as a single omni-xreview detail comment (only reached when a
      # valid sentinel-terminated verdict exists — fail-closed above means a broken
      # run posts nothing rather than a partial/forged review).
      - name: Post the omni-xreview comment
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
        run: |
          set -euo pipefail
          { echo "## omni-xreview";
            echo "_Managed \`/xreview\` on \`${REPO}#${PR}\` (branch \`${{ steps.diff.outputs.branch }}\`) — Design-18 MVP._";
            echo; cat verdict.md; } > comment.md
          gh pr comment "$PR" --repo "$REPO" --body-file comment.md
          echo "posted omni-xreview comment on ${REPO}#${PR}"
