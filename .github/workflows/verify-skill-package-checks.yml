name: verify skill-package checks

# The sweep runs scripts/skill-package-checks.sh on every skill and asserts rc=0
# and parseable output, so a checker that dies mid-sweep and drops block rules
# fails here instead of in review.
#
# The block-failure check is DIFFERENTIAL, against scripts/tests/block-baseline.txt.
# A new block failure fails here, and so does a fixed one, so the baseline shrinks
# deliberately rather than drifting.
on:
  pull_request:
    paths:
      - '.claude/skills/**'
      - 'scripts/skill-package-checks.sh'
      - 'scripts/skill-package-rubric.md'
      - 'scripts/tests/skill-package-checks.test.sh'
      - 'scripts/tests/block-baseline.txt'
      # T1 (block) reads .gitignore; the suite checks the rule-count claims in README.md
      - '.gitignore'
      - 'README.md'
      - '.github/workflows/verify-skill-package-checks.yml'

permissions:
  contents: read

jobs:
  skill-package-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sweep every skill, then diff against the baseline
        run: ./scripts/tests/skill-package-checks.test.sh
