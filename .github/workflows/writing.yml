# Checks prose against the writing contract in writing/.
#
# SCOPED TO writing/ FOR NOW. The rules are landing as a stacked series, and this
# repository has 245 Markdown files that have never met them. Widening the scope
# is its own change, with its own review, because that is the one people feel.
#
# reviewdog reports on the lines a pull request touches, so a finding on a line
# nobody edited never appears and never blocks.
name: writing

on:
  pull_request:
  push:
    branches: [main]

# reviewdog posts review comments through the API. A restricted default token
# gets a 403 and the check fails without ever reporting a finding.
permissions:
  contents: read
  pull-requests: write

jobs:
  vale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # writing/scripts/generate-mode-rules.py imports yaml. The step passes on
      # today's runner image because it happens to ship PyYAML; that is luck,
      # not a declared dependency, and it changes without notice.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml

      # check-contract-anchors.sh compares anchors/unregistered.txt against main
      # to hold the list monotonic. A shallow clone has no main to compare with,
      # and the gate says so rather than passing on one arm.
      - name: Fetch main for the monotonicity comparison
        run: git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'

      # 3.17.1 is a floor, not a preference. On 3.14.0 a `sequence` whose tokens
      # are all `tag:` entries matches nothing, which silently disables a rule.
      - name: Install Vale
        run: |
          VALE_VERSION=3.17.1
          VALE_SHA256=db947f89f2292e6a0381a61de155f6a5f5cb4cb460ca178ea412ef605559cefd
          curl -sfL -o /tmp/vale.tgz \
            "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          echo "${VALE_SHA256}  /tmp/vale.tgz" | sha256sum -c -
          tar -xz -C /usr/local/bin -f /tmp/vale.tgz vale
          vale --version

      # .vale.ini declares Packages and those are not committed. Without this the
      # rules fail to load and the failure reads as a broken configuration.
      - name: Fetch the third-party style packages
        run: vale sync

      # The eighteen section rules are generated from writing/scripts/modes.yaml.
      # A hand edit is worse than a hand-written rule: the next generator run
      # reverts it in silence.
      - name: The generated section rules match their manifest
        run: ./writing/scripts/check-generated-rules.sh

      - name: Confirm the styles load
        run: vale ls-config

      # Running the Spec Kit CLI rewrites its bundled assets, which would take
      # the fork's deltas with it. The fork lives away from those paths and this
      # asserts each delta is still present.
      - name: Spec template still carries its deltas
        run: ./writing/scripts/check-template-deltas.sh

      # A rule that stops firing is a silent failure. Fixtures catch it.
      - name: Run fixture expectations
        run: ./writing/evals/run.sh

      # Per-rule golden files. Each rule is isolated by its own config, so a
      # failure names one rule, and the golden pins line, column and message.
      - name: Run per-rule golden fixtures
        run: ./writing/evals/rules/run.sh

      # An anchor arrives with four artifacts or it does not arrive. The anchors
      # that predate the rule are marked grandfathered and counted.
      - name: Every admitted anchor carries its four artifacts
        run: ./writing/scripts/check-admission.sh

      # The coverage manifest says what each anchor actually checks. A claim
      # nobody verifies is how one anchor came to credit rules that check
      # something else, so the manifest is enforced rather than trusted.
      - name: Coverage manifest is true
        run: ./writing/scripts/check-coverage.sh

      # SC-002 in the direction nothing checked: the coverage gate reads the
      # registry and never the contract, so anchors the contract names could
      # have no entry at all. Twelve of nineteen did.
      - name: Every anchor the contract names resolves, or is recorded debt
        run: ./writing/scripts/check-contract-anchors.sh

      # A long anchor page is evidence that it restates a standard instead of
      # citing one, which NOTICE.md forbids.
      - name: Every artifact is inside its length limit
        run: ./writing/scripts/check-artifact-length.sh

      - name: Lint prose against the writing contract
        # Pinned to a commit, not the mutable `reviewdog` branch. Every other
        # workflow here pins a SHA; this one piped a branch into CI with
        # pull-requests: write.
        uses: vale-cli/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # reviewdog
        with:
          # github-pr-review resolves the pull request from the environment and
          # errors when there is none, so a push to main failed on the reporting
          # step rather than on a finding — a permanently red badge saying
          # nothing about prose.
          reporter: ${{ github.event_name == 'pull_request' && 'github-pr-review' || 'github-check' }}
          fail_level: error
          level: warning
          files: '["writing"]'
          # --no-global: a runner has no user-level Vale config and a laptop
          # does, so without it the two disagree about which rules ran.
          #
          # ONE --glob. Vale takes a single glob expression and keeps the last
          # occurrence, so a second flag silently drops the first. The brace form
          # is one expression and Vale expands it; the pinned action reaches Vale
          # without a shell, so nothing else expands it first. It is a node
          # action: it splits vale_flags itself on whitespace, honouring quotes
          # and nothing else, then spawns Vale with an argv array.
          #
          # write-good is a fetched package. evals/fixtures and evals/rules hold
          # inputs that are deliberately non-conforming, which is their job; the
          # rest of evals/ is ordinary prose and stays inside the contract. spec-template.upstream.md
          # is Spec Kit's own text, carried unedited so check-template-deltas.sh can
          # compare the fork's body against it.
          vale_flags: >-
            --no-global
            --glob=!{writing/styles/write-good/**,writing/evals/fixtures/**,writing/evals/rules/**,writing/templates/spec-template.upstream.md}
