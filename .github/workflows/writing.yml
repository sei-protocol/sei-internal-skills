# Checks prose against the writing contract in writing/.
#
# THE BACKLOG DOES NOT BLOCK. reviewdog reports on the lines a pull request
# touches. A finding on a line nobody edited never appears, so the 1,600 findings
# this repository already carries stay invisible until somebody edits that line.
#
# Most of them are one rule. ASD-STE100 does not allow contractions and this
# repository writes 'don't' 348 times. The house style changes by attrition, on
# the lines people are already editing, rather than in a sweep nobody asked for.
#
# reviewdog reports on the lines a pull request touches, so a finding on a line
# nobody edited never appears and never blocks.
name: writing

on:
  pull_request:
  push:
    branches: [main]

jobs:
  vale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 3.17.1 is a floor, not a preference. On 3.14.0 a `sequence` whose tokens
      # are all `tag:` entries matches nothing, which silently disables a rule.
      # check-contract-anchors.sh compares anchors/unregistered.txt against main
      # to hold the list monotonic. A shallow clone has no main to compare with,
      # and the gate says so rather than passing on one arm.
      - name: Fetch main for the monotonicity comparison
        run: git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'

      - name: Install Vale
        run: |
          VALE_VERSION=3.17.1
          curl -sfL "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            | tar -xz -C /usr/local/bin vale
          vale --version

      # .vale.ini declares Packages and those are not committed. Without this the
      # rules fail to load and the failure reads as a broken configuration.
      - name: Fetch the third-party style packages
        run: vale sync

      - name: Confirm the styles load
        run: vale ls-config

      # --no-global: a runner has no user-level Vale config and a laptop does, so
      # without it the two disagree about which rules ran.
      # The eighteen section rules are generated from writing/scripts/modes.yaml.
      # A hand edit is worse than a hand-written rule: the next generator run
      # reverts it in silence.
      - name: The generated section rules match their manifest
        run: ./writing/scripts/check-generated-rules.sh

      # The coverage manifest says what each anchor actually checks. A claim
      # nobody verifies is how one anchor came to credit rules that check
      # something else, so the manifest is enforced rather than trusted.
      # Running the Spec Kit CLI rewrites its bundled assets, which would take
      # the fork's deltas with it. The fork lives away from those paths and this
      # asserts each delta is still present.
      # A rule that stops firing is a silent failure. Fixtures catch it.
      - name: Run fixture expectations
        run: ./writing/evals/run.sh

      # Per-rule golden files. Each rule is isolated by its own config, so a
      # failure names one rule, and the golden pins line, column and message.
      - name: Run per-rule golden fixtures
        run: ./writing/evals/rules/run.sh

      # An anchor arrives with four artifacts or it does not arrive. The anchors
      # that predate the rule are marked grandfathered and counted.
      - name: Every admitted anchor carries its four artifacts
        run: ./writing/scripts/check-admission.sh

      - name: Spec template still carries its deltas
        run: ./writing/scripts/check-template-deltas.sh

      # The rules had golden files and the gates had none, so a gate could
      # reject a correct document and nothing would notice. One did.
      - name: Run gate golden fixtures
        run: ./writing/evals/gates/run.sh

      # An anchor earns its place by being a standard somebody else publishes.
      # Citing a skill in this repository makes the catalogue circular.
      - name: No anchor cites a skill as its authority
        run: ./writing/scripts/check-anchor-authorities.sh

      # install.sh and writing-contract.yml carry every consuming repository and
      # neither used to run. This repository's own job is a different file that
      # installs the rules differently, so green here said nothing about either.
      - name: Run the consumer path end to end
        run: ./writing/evals/consumer/run.sh

      # A structure rule left unscoped for consumers runs on every Markdown file
      # they have. Three rules had drifted between the two configurations.
      - name: The consumer configuration scopes the same rules
        run: ./writing/scripts/check-consumer-scoping.sh

      # Three of seven criteria once cited a check nobody had built. A
      # criterion citing a missing check reads exactly like one that passes.
      - name: Every success criterion names a verifier that runs
        run: ./writing/scripts/check-verifiers.sh

      - name: Coverage manifest is true
        run: ./writing/scripts/check-coverage.sh

      # SC-002 in the direction nothing checked: the coverage gate reads the
      # registry and never the contract, so anchors the contract names could
      # have no entry at all. Twelve of nineteen did.
      - name: Every anchor the contract names resolves, or is recorded debt
        run: ./writing/scripts/check-contract-anchors.sh

      # A long anchor page is evidence that it restates a standard instead of
      # citing one, which NOTICE.md forbids.
      - name: Every artifact is inside its length limit
        run: ./writing/scripts/check-artifact-length.sh

      - name: Lint prose against the writing contract
        uses: vale-cli/vale-action@reviewdog
        with:
          reporter: github-pr-review
          fail_level: error
          level: warning
          # The whole repository now, not writing/ alone. reviewdog reports on
          # the lines a pull request touches, so the backlog below never appears
          # and never blocks; only prose somebody edits meets the bar.
          #
          # scripts/ is here because sei-internal-skills-doctrine.md is the file
          # that fans out into every consuming repository's AGENTS.md. It is the
          # highest-value prose here and it was the last thing in scope.
          files: '["README.md", "AGENTS.md", "CLAUDE.md", "agents", ".claude", "experimental", "scripts", "writing"]'
          # --glob: writing/styles/write-good is a fetched package and its README
          # is not this repository's prose to fix.
          # ONE --glob. Vale takes a single glob expression; passing the flag
          # more than once keeps only the last, so the exclusions go in one
          # brace pattern or all but one silently stop applying.
          #
          # write-good is a fetched package. evals/ holds fixtures that are
          # deliberately non-conforming, which is their job. upstream.md is
          # Spec Kit's own text, kept verbatim so check-template-deltas.sh can
          # diff against it; editing it to satisfy a prose rule defeats the check.
          vale_flags: >-
            --no-global
            --glob=!{writing/styles/write-good/**,writing/evals/**,writing/templates/spec-template.upstream.md}
