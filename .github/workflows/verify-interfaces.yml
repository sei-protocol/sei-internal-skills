name: Verify Interface Registry

on:
  pull_request:
    paths:
      - 'tide/interface-registry.yaml'
      - 'pkg/**'
      - 'runtimes/**'
      - 'contracts/**'
      - 'manifests/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Verify interfaces against registry
        run: python .claude/skills/tide-council/scripts/verify_registry.py
