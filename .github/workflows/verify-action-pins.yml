name: verify action pins

# A tag is mutable. A workflow that `uses:` one runs whatever its author pushed
# last, and the four ecr-*.yml workflows assume an AWS role and push to ECR.
# No other gate reads a `uses:` ref.
#
# The filter takes all of .github/ because the gate does: a composite action under
# .github/actions/ carries `uses:` too, and a narrower filter would let one in.
on:
  pull_request:
    paths:
      - '.github/**'
      - 'scripts/verify-action-pins.sh'

permissions:
  contents: read

jobs:
  pins:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every workflow ref is a commit sha
        run: ./scripts/verify-action-pins.sh
