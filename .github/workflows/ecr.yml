name: ECR

# Build + push the sei-tide-omnigent overlay server image to us-east-2 ECR
# (PLT-735). Mirrors sei-k8s-controller's ecr.yml: OIDC into the common/gha role,
# amazon-ecr-login + buildx, a Tide-isolated registry build-cache ref,
# ${{ github.sha }} tag.
#
# Path-filtered to sei_omnigent/** because Tide is a multi-purpose monorepo —
# only changes under the overlay should publish a new image. The existing
# verify-*.yml workflows are untouched (they own lint/test/packaging gates).
#
# PLT-715: two images publish from here — the coordinator SERVER image
# (sei_omnigent/Dockerfile, tag <sha>) and the runnable HOST image
# (Dockerfile.host, tag <sha>-host), same sei/sei-tide-omnigent repo. The host
# build adds `.claude/**` to the path-filter (the baked overlay is a host input).
# Rationale (one-repo-two-tags, cross-region pull) + the hash-pinned-lockfile
# follow-up: see the PR.

on:
  push:
    branches: [main]
    paths:
      - 'sei_omnigent/**'
      - 'Dockerfile.host'
      - '.claude/**'
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (defaults to git sha)"
        required: false

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::189176372795:role/common/gha
          role-duration-seconds: 900
          aws-region: us-east-2

      - id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push sei-tide-omnigent image
        uses: docker/build-push-action@v6
        with:
          context: sei_omnigent
          file: sei_omnigent/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.ecr-login.outputs.registry }}/sei/sei-tide-omnigent:${{ inputs.tag || github.sha }}
          # Tide-isolated cache ref — Tide CI must not read/write the :shared
          # cache other repos' builds trust.
          cache-from: type=registry,ref=${{ steps.ecr-login.outputs.registry }}/sei/build-cache:sei-tide-omnigent
          cache-to: type=registry,ref=${{ steps.ecr-login.outputs.registry }}/sei/build-cache:sei-tide-omnigent,mode=max

  publish-host:
    # The runnable host image (Dockerfile.host) — same OIDC -> us-east-2 ECR
    # pattern as the server publish, distinct tag (<sha>-host) and a separate
    # build cache. Context is the REPO ROOT (`.`), not sei_omnigent/, because the
    # baked `.claude/` overlay lives at the repo root.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::189176372795:role/common/gha
          role-duration-seconds: 900
          aws-region: us-east-2

      - id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push sei-tide-omnigent host image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.host
          push: true
          platforms: linux/amd64
          tags: ${{ steps.ecr-login.outputs.registry }}/sei/sei-tide-omnigent:${{ inputs.tag && format('{0}-host', inputs.tag) || format('{0}-host', github.sha) }}
          cache-from: type=registry,ref=${{ steps.ecr-login.outputs.registry }}/sei/build-cache:sei-tide-omnigent-host
          cache-to: type=registry,ref=${{ steps.ecr-login.outputs.registry }}/sei/build-cache:sei-tide-omnigent-host,mode=max
