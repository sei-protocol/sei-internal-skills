name: Verify Doctrine Block

on:
  pull_request:
    paths:
      - 'scripts/sei-internal-skills-doctrine.md'
      - 'scripts/lib/inject-doctrine.sh'
      - 'scripts/tests/inject-doctrine.test.sh'
      - 'AGENTS.md'
      - 'CLAUDE.md'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify the doctrine block is in sync with its source
        run: make sync-doctrine-self-check

      - name: Run the doctrine-injector regression suite
        run: make test-doctrine
