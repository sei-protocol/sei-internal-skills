name: ECR Runner Base

# Build + push the runner BASE image -- the omnigent host image Dockerfile.runner
# then layers the .claude overlay onto.
#
# This exists because the base had no pipeline. The deployed base
# (runner-e6216fc7-credbridge) was pushed by hand and pinned by digest in
# runner-base.txt, so nothing recorded how to reproduce it. A base you cannot
# rebuild is a base you cannot patch -- the same reasoning as ecr-server-base.yml,
# which this mirrors.
#
# Source is the fork, not this repo: the host binary and the .claude overlay have
# different owners, which is why the image has two layers. A fork commit cannot
# trigger this -- the ref is an explicit input, which suits something bumped
# deliberately alongside the server base.
#
# Build the runner base from the SAME fork ref as the server base. The host
# dials the server over a tunnel whose protocol is versioned by neither side;
# mixed versions are the combination upstream never tests.
#
# amd64 only, matching the sandbox NodePool's default selector.
#
# This build is the fleet's only source of fresh harness CLIs, so it carries two
# things that keep "rebuilt" and "current" the same statement: it passes
# HARNESS_CLI_REFRESH, which is the only input that moves the cache key of the
# Dockerfile's `npm install -g` layer, and it gates the built image on the baked
# claude-code version. Both exist because neither did: the deployed base served
# claude-code 2.1.197 for over two months while every rebuild reported success.
#
# Publishing does not roll anything. Deploying is three deliberate steps: the
# digest here into runner-base.txt, then ecr-runner.yml for the overlay, then the
# overlay digest into platform's sandbox-config-patch.yaml with a
# config-revision bump.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "omnigent fork ref to build (branch, tag or sha)"
        required: true
        default: feat/sei-base
      tag:
        description: "Image tag (defaults to runner-<short ref sha>-credbridge)"
        required: false

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the fork at the requested ref
        uses: actions/checkout@v4
        with:
          repository: bdchatham/omnigent
          ref: ${{ inputs.ref }}
          # The fork is public, so the job's own token reads it. Setting
          # OMNIGENT_FORK_TOKEN repairs this if it is ever made private, without
          # touching this file -- otherwise the failure reads as "repository not
          # found", which names neither the cause nor the fix.
          token: ${{ secrets.OMNIGENT_FORK_TOKEN || github.token }}
          # The build reads the git history for its version string.
          fetch-depth: 0

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::189176372795:role/common/gha
          role-duration-seconds: 3600
          aws-region: us-east-2

      - id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - id: vars
        name: Resolve the target tag, the cache-refresh key, and the CLI baseline
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse --short=8 HEAD)"
          echo "tag=${INPUT_TAG:-runner-${sha}-credbridge}" >> "$GITHUB_OUTPUT"
          echo "built ${sha} ($(git log -1 --format=%s | cut -c1-60))"

          # HARNESS_CLI_REFRESH moves the cache key of the Dockerfile's
          # `npm install -g` layer. Nothing else in that layer varies across fork
          # commits, so without this the registry cache replays it forever and the
          # image's harness CLIs freeze at whatever the first build resolved.
          # run_attempt is included so re-running a failed job gets a fresh key.
          echo "refresh=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

          # The claude-code release that was current BEFORE the build started.
          # Captured here, not after, so a publish landing mid-build makes the
          # baked CLI newer than this baseline rather than failing the gate.
          latest="$(npm view @anthropic-ai/claude-code version)"
          [ -n "$latest" ] || { echo "could not read claude-code's latest version" >&2; exit 1; }
          echo "claude_latest=${latest}" >> "$GITHUB_OUTPUT"
          echo "claude-code latest at build start: ${latest}"

      - name: Build the host target
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.sei
          target: host
          push: false
          load: true
          platforms: linux/amd64
          tags: sei-omnigent-runner-base:candidate
          # The Push step below MUST pass the identical value. It is a second
          # build reading this build's cache; a different key would re-run the
          # npm layer and push an image no gate below ever saw.
          build-args: HARNESS_CLI_REFRESH=${{ steps.vars.outputs.refresh }}
          cache-from: type=registry,ref=${{ steps.ecr-login.outputs.registry }}/sei/build-cache:sei-omnigent-runner-base
          cache-to: type=registry,ref=${{ steps.ecr-login.outputs.registry }}/sei/build-cache:sei-omnigent-runner-base,mode=max

      - name: Gate — the credential bridge resolves a mounted token
        # The bridge is the whole reason this base is a fork build rather than
        # upstream's host image. It is also invisible at runtime when broken: a
        # runner with no credential clones nothing and reports it read nothing,
        # which reads as the agent failing rather than the image failing.
        #
        # Asserted against a FAKE token on a fake mount, so the gate needs no
        # secret and proves the wiring rather than the credential. The check
        # script's own network probe is skipped for the same reason.
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # NOT -e SEI_RUNNER_REQUIRE_GIT_TOKEN=1 on the container: the image runs
          # the readiness check from /etc/profile.d on EVERY login shell, so it
          # fires before this script body can write the fake token. With REQUIRE
          # set, that first firing fails the shell and no assertion below ever
          # runs. Unset, the same firing exits 0 (nothing mounted, nothing to
          # assert) and the checks proceed -- which is also the behaviour the
          # workspace-prep init container depends on, since it gets no mount.
          docker run --rm --user 0 \
            -e SEI_RUNNER_CREDENTIAL_CHECK_SKIP_NETWORK=1 \
            --entrypoint bash sei-omnigent-runner-base:candidate -lc '
              set -euo pipefail
              mkdir -p /mnt/secrets/git
              printf "ghp_fakefakefakefakefakefakefakefake" > /mnt/secrets/git/token

              # gh must resolve the mounted token via the PATH wrapper. A
              # non-login shell is what the agent tools actually get.
              bash -c "gh auth token --hostname github.com" | grep -q "^ghp_fake" \
                || { echo "FAIL: gh wrapper did not export GH_TOKEN from the mount"; exit 1; }
              echo "  ok gh bridge"

              # git must answer credential fill for github.com, and ONLY github.com.
              printf "protocol=https\nhost=github.com\n\n" \
                | GIT_TERMINAL_PROMPT=0 git credential fill | grep -q "^password=ghp_fake" \
                || { echo "FAIL: git helper returned no password for github.com"; exit 1; }
              echo "  ok git bridge"

              printf "protocol=https\nhost=evil.com\n\n" \
                | GIT_TERMINAL_PROMPT=0 git credential fill 2>/dev/null | grep -q "^password=ghp_fake" \
                && { echo "FAIL: the token leaked to a non-github host"; exit 1; }
              echo "  ok host scoping"

              command -v sei-runner-credential-check >/dev/null \
                || { echo "FAIL: sei-runner-credential-check absent"; exit 1; }
              sei-runner-credential-check >/dev/null 2>&1 \
                || { echo "FAIL: the readiness gate rejected a mounted token"; exit 1; }
              echo "  ok readiness gate accepts a mounted token"

              # And that it FAILS closed when a token is required but absent --
              # the assertion that makes the gate mean something. Set per-call,
              # since setting it on the container breaks the profile.d firing above.
              rm -f /mnt/secrets/git/token
              if SEI_RUNNER_REQUIRE_GIT_TOKEN=1 sei-runner-credential-check >/dev/null 2>&1; then
                echo "FAIL: the readiness gate passed with no token and REQUIRE set"; exit 1
              fi
              echo "  ok readiness gate fails closed"

              echo "runner-base-ok"
            '

      - name: Gate — the baked claude-code is not older than the current release
        # The Dockerfile asserts this too, but an assertion inside a layer is
        # skipped on exactly the cache hit it exists to catch. This one runs
        # against the built image, so no cache can skip it, and it is what makes
        # "the base was rebuilt" mean "the base is current".
        #
        # This is the gate the fleet did not have. The deployed runner served
        # claude-code 2.1.197 for over two months and ~70 releases because npm
        # silently resolves the newest release the image's Node can run, and
        # every build reported success. The visible symptom was a model picker
        # offering only Opus 5.
        #
        # Compared against the version captured BEFORE the build, so a release
        # published mid-build makes the image newer than the baseline and passes.
        # Only an image that is OLDER than the baseline fails.
        timeout-minutes: 5
        env:
          WANT: ${{ steps.vars.outputs.claude_latest }}
        run: |
          set -euo pipefail
          # grep -m1, matching the convention in ecr-runner.yml: under pipefail,
          # head closing the pipe early can surface as SIGPIPE from grep and fail
          # the step. -m1 makes grep exit on its own; head only trims a second
          # match on the same line.
          read_ver() {
            docker run --rm --user 0 -e SEI_RUNNER_CREDENTIAL_CHECK_SKIP_NETWORK=1 \
              --entrypoint bash sei-omnigent-runner-base:candidate \
              -lc "$1 --version 2>&1" | grep -m1 -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1
          }
          for bin in claude codex pi; do
            echo "  baked ${bin} $(read_ver "$bin")"
          done

          # || true so the guard below reports the failure. Bare, an empty read
          # trips set -e at the assignment and the diagnostic never prints.
          GOT="$(read_ver claude || true)"
          [ -n "$GOT" ] || { echo "FAIL: no parseable claude --version in the image"; exit 1; }

          if [ "$GOT" != "$WANT" ] \
             && [ "$(printf '%s\n%s\n' "$GOT" "$WANT" | sort -V | head -n1)" = "$GOT" ]; then
            echo "FAIL: the image bakes claude-code ${GOT}; ${WANT} was current when this build started."
            echo "  npm resolves an unpinned package to the newest release the image's Node"
            echo "  can run and exits 0 when that is not latest. Check HARNESS_NODE_VERSION"
            echo "  in deploy/docker/Dockerfile.sei against:"
            echo "    npm view @anthropic-ai/claude-code@${WANT} engines.node"
            echo "  If the Node floor is right, the npm layer was replayed from the build"
            echo "  cache — confirm HARNESS_CLI_REFRESH reached the build."
            exit 1
          fi
          echo "cli-freshness-ok claude ${GOT} (baseline ${WANT})"

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.sei
          target: host
          push: true
          platforms: linux/amd64
          tags: ${{ steps.ecr-login.outputs.registry }}/sei/sei-omnigent:${{ steps.vars.outputs.tag }}
          # Identical to the Build step's key, so this resolves entirely from
          # that build's cache and pushes the exact image the gates accepted.
          build-args: HARNESS_CLI_REFRESH=${{ steps.vars.outputs.refresh }}
          cache-from: type=registry,ref=${{ steps.ecr-login.outputs.registry }}/sei/build-cache:sei-omnigent-runner-base

      - name: Report the digest to pin in runner-base.txt
        env:
          REF: ${{ steps.ecr-login.outputs.registry }}/sei/sei-omnigent:${{ steps.vars.outputs.tag }}
          # Through the environment, not interpolated into the script: a dispatch
          # input reaching a shell as text is an injection, and this step runs
          # after the AWS credentials are configured.
          TAG: ${{ steps.vars.outputs.tag }}
          SOURCE_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "$REF" --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
          [ -n "$digest" ] || { echo "could not resolve the pushed digest" >&2; exit 1; }
          {
            echo "### Runner base published"
            echo
            echo "Pin this in \`runner-base.txt\`, then run **ECR Runner** to rebuild the overlay:"
            echo
            echo '```'
            echo "189176372795.dkr.ecr.us-east-2.amazonaws.com/sei/sei-omnigent@${digest}"
            echo '```'
            echo
            echo "Tag: \`$TAG\` — built from \`$SOURCE_REF\`."
          } >> "$GITHUB_STEP_SUMMARY"
