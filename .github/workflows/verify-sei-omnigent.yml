name: Verify sei_omnigent overlay

# Lints + tests the sei_omnigent Omnigent overlay against the Python idiom pack
# (PLT refinement). This is the omnigent-FREE unit job: the overlay's tests run
# without omnigent installed (pure logic / AST guards / skip-if-absent), so we
# install only the linter + test runner and the package itself with --no-deps so
# `import sei_omnigent` resolves WITHOUT pulling omnigent. The omnigent-installed
# behavioral tests (header-posture, the drift canary) skip here and are covered
# by a separate integration job.

on:
  pull_request:
    paths:
      - 'sei_omnigent/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sei_omnigent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling (omnigent-free)
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          pip install -e . --no-deps

      - name: Ruff lint
        run: ruff check .

      - name: Pytest (omnigent-free unit suite)
        run: pytest
