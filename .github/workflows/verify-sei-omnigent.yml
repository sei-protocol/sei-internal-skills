name: Verify sei_omnigent overlay

# Lints + tests the sei_omnigent Omnigent overlay against the Python idiom pack
# (PLT refinement). This is the omnigent-FREE unit job: the overlay's tests run
# without omnigent installed (pure logic / AST guards / skip-if-absent), so we
# install only the linter + test runner + an editable install of the overlay
# itself (`--no-deps`, so omnigent is NOT pulled). Under the src/ layout
# (PLT-689) the package lives at src/sei_omnigent/ and is NOT on sys.path, so
# `import sei_omnigent` requires the editable install — it is real here, no
# longer the no-op it was under the old flat layout.
#
# A separate wheel-smoke job (PLT-689) is the packaging regression guard: it
# BUILDS the wheel, installs it into a clean env, and imports the package + the
# modules behind the console-script entry. This is what proves `pip install .`
# produces an importable package (the flat layout silently produced an empty
# wheel — `top_level.txt` was empty — so the K8s `sei-omnigent-serve` entrypoint
# would ModuleNotFoundError). It unblocks the PLT-688 integration job.
#
# NOT yet wired: an omnigent-INSTALLED integration job that exercises the
# skip-guarded behavioral tests (the shim-drift canary in test_seam_contract.py,
# the header-posture behavioral test). Those currently skip here and run nowhere
# — tracked in PLT-688. Until it lands, those tests do not gate.

on:
  pull_request:
    paths:
      - 'sei_omnigent/**'
      # The workflow's own path — so a workflow-only fix still exercises the job
      # (else a broken install/command could merge without ever running here).
      - '.github/workflows/verify-sei-omnigent.yml'
      # The specialist roster — test_baseline_tracks_the_actual_roster compares
      # harness.py's ROSTER_BASELINE to the live .claude/agents/ count, so a PR
      # that adds/removes an agent must re-run this job or the baseline silently
      # drifts undetected.
      - '.claude/agents/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sei_omnigent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling + the overlay (omnigent-free)
        # Editable install of the overlay (--no-deps ⇒ omnigent is NOT pulled, so
        # this stays omnigent-free). Under the src/ layout (PLT-689) the package
        # is NOT auto-on-sys.path, so this install is how `import sei_omnigent`
        # resolves for the suite — real, not the no-op it was under the old flat
        # layout. ruff + pytest are the linter + runner.
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          pip install -e . --no-deps

      - name: Ruff lint
        run: ruff check .

      - name: Pytest (omnigent-free unit suite)
        run: pytest

  # Packaging regression guard (PLT-689). Builds the wheel from the src/ layout,
  # installs it into a CLEAN env, and imports the package + the two modules that
  # back the `sei-omnigent-serve` console script. Proves the BUILT WHEEL exposes
  # an importable `sei_omnigent` — the exact failure the flat layout hid (empty
  # wheel ⇒ K8s entrypoint ModuleNotFoundError). Separate job so it runs in a
  # pristine interpreter (no editable install, no repo dir on sys.path) — an
  # import that only works because of the source tree would be a false pass.
  wheel-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sei_omnigent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel + import from clean install (no deps)
        # build a wheel from pyproject (PEP 517), install ONLY that wheel
        # (--no-deps ⇒ omnigent-free), then import from a dir OUTSIDE the source
        # tree so the import can only resolve via the installed wheel. The import
        # exercises the package + server.serve_main (the entry target) +
        # policies.read_only (a pure submodule) — all must come from site-packages.
        run: |
          python -m pip install --upgrade pip build
          # Default ISOLATED build: build provisions the pyproject-declared
          # backend (setuptools>=68) in a fresh build env — no reliance on the
          # runner's ambient setuptools/wheel version.
          python -m build --wheel
          ls -l dist/
          pip install dist/*.whl --no-deps
          cd /tmp
          python -c "import sei_omnigent, sei_omnigent.server.serve_main, sei_omnigent.policies.read_only; print('wheel import OK:', sei_omnigent.__file__)"

      - name: Verify console-script entry point is installed
        # The wheel must also expose the `sei-omnigent-serve` entry point so the
        # K8s deploy's equivalent command resolves. Assert it is registered (don't
        # RUN it — `main` binds uvicorn and needs omnigent, absent in this job).
        run: |
          python - <<'PY'
          from importlib.metadata import entry_points
          eps = entry_points(group="console_scripts")
          names = {ep.name: ep.value for ep in eps}
          assert names.get("sei-omnigent-serve") == "sei_omnigent.server.serve_main:main", names
          print("console-script OK:", names["sei-omnigent-serve"])
          PY
