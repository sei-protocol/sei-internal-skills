name: Verify Skill/Agent Catalog

# Fails closed if a skill or agent file does not name itself, then runs the catalog suite.

on:
  pull_request:
    paths:
      - '.claude/skills/**/SKILL.md'
      - '.claude/agents/**.md'
      - 'scripts/sync-skills.sh'
      - 'scripts/sync-agents.sh'
      - 'scripts/tests/catalog-coverage.test.sh'
      - 'Makefile'
      # The suite reads the catalog count row.
      - 'README.md'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify every skill and agent names itself
        run: make verify-catalog

      - name: Run the catalog-coverage regression suite
        run: ./scripts/tests/catalog-coverage.test.sh
