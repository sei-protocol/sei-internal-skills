name: Verify Output Styles

on:
  pull_request:
    paths:
      - '.claude/output-styles/**'
      - 'scripts/sync-output-styles.sh'
      - 'scripts/tests/sync-output-styles.test.sh'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run the output-style syncer regression suite
        run: make test-output-styles
