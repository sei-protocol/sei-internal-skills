name: Verify sei-agent-driver

# The one Go module in this repo, so this is the only workflow that needs a Go
# toolchain. Path-scoped for that reason: a pull request that touches only skills
# or agents should not wait on a build it cannot break.
#
# `make driver-check` is the same target a contributor runs locally, invoked here
# rather than reimplemented, so what gates the pull request cannot drift from what
# passes on a laptop.

on:
  pull_request:
    paths:
      - 'sei-agent-driver/**'
      - 'Makefile'
      - '.github/workflows/verify-agent-driver.yml'
  push:
    branches:
      - main
    paths:
      - 'sei-agent-driver/**'
      - 'Makefile'
      - '.github/workflows/verify-agent-driver.yml'

permissions:
  contents: read

concurrency:
  group: verify-agent-driver-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Pinned to the module's declared floor rather than `stable`: the floor is
      # what a consumer building this binary may be on, so it is the version that
      # has to keep compiling.
      - uses: actions/setup-go@v5
        with:
          go-version-file: sei-agent-driver/go.mod
          cache-dependency-path: sei-agent-driver/go.sum

      - name: gofmt, build, vet, test -race, mod tidy
        run: make driver-check
