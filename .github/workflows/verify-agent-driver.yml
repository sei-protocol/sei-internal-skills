name: Verify sei-agent-driver

on:
  pull_request:
    paths: &agent-driver-paths
      - 'sei-agent-driver/**'
      - 'Makefile'
      - '.github/workflows/verify-agent-driver.yml'
  push:
    branches:
      - main
    paths: *agent-driver-paths

permissions:
  contents: read

concurrency:
  group: verify-agent-driver-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to a commit, not a tag: a tag is mutable, so the same workflow
      # can run different code tomorrow.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # v7, not v5: v5 matches only the `go` directive in go.mod, so it installs the
      # language version and leaves the pinned `toolchain` to a run-time download.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sei-agent-driver/go.mod
          cache-dependency-path: sei-agent-driver/go.sum

      - name: gofmt, build, vet, test -race, mod tidy
        run: make driver-check
