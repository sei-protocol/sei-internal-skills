name: verify references

# A shipped artifact that cites a resource the core does not hold reads to an
# engineer as the AGENT misbehaving, not as an incomplete install. No other gate
# catches it: verify-doctrine-block checks this repo's AGENTS.md against the
# source file, and it does not resolve a cited name.
on:
  pull_request:
    paths:
      - '.claude/**'
      - 'scripts/sei-internal-skills-doctrine.md'
      # The gate reads these three. Without them a README-only pull request
      # reintroduces the defect with a green check.
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'scripts/verify-references.sh'
      - 'scripts/tests/verify-references.test.sh'
      - '.github/workflows/verify-references.yml'

permissions:
  contents: read

jobs:
  references:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve every citation in a shipped artifact
        run: ./scripts/verify-references.sh
      - name: Regression suite
        run: ./scripts/tests/verify-references.test.sh
