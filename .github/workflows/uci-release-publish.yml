name: Releaser

on:
  push:
    paths: [ 'version.json' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  publish:
    uses: sei-protocol/uci/.github/workflows/release-publish.yml@v0.0.15

  goreleaser:
    needs: publish
    if: needs.publish.outputs.release_created == 'true'
    uses: sei-protocol/uci/.github/workflows/goreleaser-release.yml@v0.0.15
    with:
      working-directory: sei-agent-driver
      ref: ${{ needs.publish.outputs.version }}

  # A nested module resolves only a path-prefixed tag, so `go install` needs this
  # one alongside the plain release tag.
  module-tag:
    needs: publish
    if: needs.publish.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.version }}

      - env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          tag="sei-agent-driver/${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "${tag} already exists"
            exit 0
          fi
          git tag "${tag}"
          git push origin "refs/tags/${tag}"
          echo "tagged ${tag}"

  # A cut is tagged where it lands, so it carries what the branch had when it
  # merged. Merge it before the work it was cut for and the release ships without
  # it, and nothing says so: the tag, the release and every check are green, and
  # the absence shows only in the tagged tree.
  #
  # v0.10.0 and v0.10.1 both shipped that way. This is what makes the third one
  # red instead of quiet.
  release-contents:
    needs: [ publish, module-tag ]
    if: needs.publish.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          git fetch -q origin main
          if git diff --quiet "$VERSION" origin/main -- sei-agent-driver/; then
            echo "$VERSION carries every driver change on main"
            exit 0
          fi
          echo "::error::$VERSION was tagged without driver work already on main. The tag cannot move — cut the next patch version."
          git log --oneline "$VERSION..origin/main" -- sei-agent-driver/ \
            | sed 's/^/  missing: /'
          exit 1
