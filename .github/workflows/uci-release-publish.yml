name: Releaser

on:
  push:
    paths: [ 'version.json' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  publish:
    uses: sei-protocol/uci/.github/workflows/release-publish.yml@65901242783550521f25a19199a6b10e54550b97 # v0.0.15

  goreleaser:
    needs: publish
    if: needs.publish.outputs.release_created == 'true'
    uses: sei-protocol/uci/.github/workflows/goreleaser-release.yml@65901242783550521f25a19199a6b10e54550b97 # v0.0.15
    with:
      working-directory: sei-agent-driver
      ref: ${{ needs.publish.outputs.version }}

  # A nested module resolves only a path-prefixed tag, so `go install` needs this
  # one alongside the plain release tag.
  module-tag:
    needs: publish
    if: needs.publish.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.publish.outputs.version }}

      - env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          tag="sei-agent-driver/${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "${tag} already exists"
            exit 0
          fi
          git tag "${tag}"
          git push origin "refs/tags/${tag}"
          echo "tagged ${tag}"
