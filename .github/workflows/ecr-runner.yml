name: ECR Runner

# Build + push the runner overlay image to us-east-2 ECR, gated on the same
# assertions the PR check runs. An image without its roster or its credential bridge
# cannot be published.
#
# The base is upstream's published omnigent host image, pinned in runner-base.txt.
# It is public, so the build pulls it from ghcr.io with no credentials.
#
# Auth mirrors the repo's other ECR workflows: OIDC into common/gha, amazon-ecr-login,
# buildx. Tagged `runner-overlay-<sha>` in the shared sei/sei-omnigent repo so it is
# distinguishable from the server overlay (`server-overlay-*`). Build cache lives in
# the dedicated sei/build-cache repo, kept out of the deployable repo so a cache
# manifest can never be mistaken for a deploy tag.
#
# amd64 only, matching the provider's default nodeSelector (kubernetes.io/arch: amd64)
# for sandbox Pods. The base is a multi-arch manifest list, so this narrows it: an
# arm64 sandbox node would fail to pull. Revisit if the nodepool ever gains arm64.
#
# Publishing does not roll anything. Deploying is a deliberate digest bump in
# platform's clusters/dev/seigent/sandbox-config-patch.yaml.

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.runner'
      - 'Dockerfile.runner.dockerignore'
      - 'runner-base.txt'
      - '.claude/**'
      - 'scripts/managed-settings.json'
      - 'scripts/sei-runner-credential-check'
      - 'scripts/check-runner-credential-bridge.sh'
      - 'writing/styles/**'
      - 'writing/templates/consumer.vale.ini'
      - 'scripts/sei-writing-lint'
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (defaults to runner-overlay-<git sha>)"
        required: false

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::189176372795:role/common/gha
          role-duration-seconds: 900
          aws-region: us-east-2

      - id: ecr-login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: vars
        name: Resolve the pinned base and the target tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # grep -m1 rather than `grep | head`: under pipefail, head closing early can
          # surface as SIGPIPE from grep and fail the step.
          base="$(grep -m1 -vE '^\s*(#|$)' runner-base.txt)"
          [ -n "$base" ] || { echo "runner-base.txt carries no image reference" >&2; exit 1; }
          tag="${INPUT_TAG:-runner-overlay-${GITHUB_SHA}}"
          echo "image=$base" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build against the real base
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.runner
          build-args: BASE_IMAGE=${{ steps.vars.outputs.image }}
          push: false
          load: true
          platforms: linux/amd64
          tags: sei-runner-overlay:candidate
          cache-from: type=registry,ref=${{ steps.ecr-login.outputs.registry }}/sei/build-cache:sei-omnigent-runner-overlay
          cache-to: type=registry,ref=${{ steps.ecr-login.outputs.registry }}/sei/build-cache:sei-omnigent-runner-overlay,mode=max

      - name: Gate — the credential bridge resolves a mounted token
        timeout-minutes: 5
        run: |
          set -euo pipefail
          docker run --rm --user 0 -e SEI_RUNNER_CREDENTIAL_CHECK_SKIP_NETWORK=1 \
            -v "$PWD/scripts/check-runner-credential-bridge.sh:/tmp/check-bridge.sh:ro" \
            --entrypoint bash sei-runner-overlay:candidate -l /tmp/check-bridge.sh

      - name: Gate — the overlay reaches $HOME on the real base
        # Same assertions the PR gate makes. Running them here is what makes
        # publishing safe: an image missing its roster, a pinned steward, or the
        # admin policy never gets a tag.
        timeout-minutes: 5
        run: |
          set -euo pipefail
          docker run --rm --user 1000660000:1000660000 \
            --tmpfs /home/omnigent:exec,mode=1777 -e HOME=/home/omnigent \
            --entrypoint bash sei-runner-overlay:candidate -lc '
              set -euo pipefail
              for a in prose-steward idiomatic-reviewer; do
                test -f "$HOME/.claude/agents/$a.md" || { echo "FAIL: pinned steward agents/$a.md not seeded"; exit 1; }
              done
              for s in root-cause xreview; do
                test -f "$HOME/.claude/skills/$s/SKILL.md" || { echo "FAIL: skills/$s not seeded"; exit 1; }
              done
              n=$(ls "$HOME/.claude/agents"/*.md | wc -l)
              # Floor, not a target — see verify-runner-image.yml. Reset by the
              # 2026-08 slim-down; catches accidental loss, not deliberate change.
              [ "$n" -ge 16 ] || { echo "FAIL: roster shrank to $n"; exit 1; }
              command -v specify >/dev/null || { echo "FAIL: specify absent"; exit 1; }
              P=/etc/claude-code/managed-settings.json
              test -f "$P" || { echo "FAIL: $P absent (a headless permission request wedges the session)"; exit 1; }
              ! test -w "$P" || { echo "FAIL: $P is writable by the agent uid it governs"; exit 1; }
              python3 -c "import json,sys; d=json.load(open(sys.argv[1])); sys.exit(0 if d[\"permissions\"][\"allow\"] else 1)" "$P" \
                || { echo "FAIL: $P is not valid JSON carrying a non-empty permissions.allow"; exit 1; }
              echo "real-base-ok agents=$n specify=$(specify --version 2>&1 | head -1) policy=ok"
            '

      - name: Report how stale the base's harness CLIs are
        # A WARNING, never a failure. This job's input is the overlay, not the CLIs;
        # the CLIs arrive from the upstream release runner-base.txt pins. Failing
        # here would block a roster-only rebuild for a reason that rebuild cannot
        # fix, and a gate that fires on unrelated work is a gate someone removes.
        #
        # A stale pin is otherwise invisible at exactly this step: every overlay
        # built on it publishes green. The threshold is deliberately loose. Upstream
        # releases weekly, so 30 days flags a pin that stopped moving rather than one
        # that is merely a few CLI releases behind.
        timeout-minutes: 5
        continue-on-error: true
        run: |
          set -euo pipefail
          # Both reads carry || true, and an unread one says so. Bare, set -e ends
          # the step before its first echo, and continue-on-error then renders that
          # identical to the current-CLI path: no version line, no warning, green
          # step. A detector that reports nothing when it breaks is the failure
          # mode this step exists to catch.
          got="$(docker run --rm --user 0 -e SEI_RUNNER_CREDENTIAL_CHECK_SKIP_NETWORK=1 \
                   --entrypoint bash sei-runner-overlay:candidate -lc 'claude --version 2>&1' \
                 | grep -m1 -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1 || true)"
          latest="$(npm view @anthropic-ai/claude-code version || true)"
          if [ -z "$got" ] || [ -z "$latest" ]; then
            echo "::warning::Could not determine runner-base CLI staleness (baked '${got:-unread}', npm latest '${latest:-unread}'). This check did not run; it did not pass."
            exit 0
          fi
          echo "base bakes claude-code ${got}; npm latest is ${latest}"
          [ "$got" = "$latest" ] && { echo "base CLI is current"; exit 0; }

          # Age of the BAKED release, not a release count: claude-code publishes
          # more than once a day, so a count reads as alarming within a normal week.
          pub="$(npm view "@anthropic-ai/claude-code@${got}" time --json 2>/dev/null \
                 | python3 -c "import json,sys; print(json.load(sys.stdin).get('$got',''))" || true)"
          if [ -n "$pub" ]; then
            days=$(( ( $(date -u +%s) - $(date -u -d "$pub" +%s) ) / 86400 ))
            echo "baked release is ${days} day(s) old (published ${pub})"
            if [ "$days" -ge 30 ]; then
              echo "::warning::The pinned runner base bakes claude-code ${got}, ${days} days old (latest ${latest}). Bump runner-base.txt and server-base.txt to a newer upstream omnigent release."
            fi
          fi

      - name: Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.runner
          build-args: BASE_IMAGE=${{ steps.vars.outputs.image }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.ecr-login.outputs.registry }}/sei/sei-omnigent:${{ steps.vars.outputs.tag }}
          cache-from: type=registry,ref=${{ steps.ecr-login.outputs.registry }}/sei/build-cache:sei-omnigent-runner-overlay

      - name: Report the digest to pin
        env:
          REF: ${{ steps.ecr-login.outputs.registry }}/sei/sei-omnigent:${{ steps.vars.outputs.tag }}
        run: |
          set -euo pipefail
          # Interpolate via env, never inline into the shell. stderr stays in the log
          # rather than the persisted summary.
          digest="$(docker buildx imagetools inspect "$REF" --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
          {
            echo "Pin in platform clusters/dev/seigent/sandbox-config-patch.yaml:"
            echo '```'
            echo "${digest:-<inspect failed, see the job log>}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
