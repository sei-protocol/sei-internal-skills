# Wiring only. The review logic lives in sei-protocol/uci and the reviewer binary in
# this repository's sei-agent-driver module; both document their own behaviour and
# inputs.
#
#   @seidroid review                  review this pull request
#   @seidroid review close            destroy this pull request's session now
name: seidroid review

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, ready_for_review, synchronize, reopened, closed]

permissions: {}

jobs:
  # A Dependabot pull request gets no automatic review: GitHub gives its runs
  # Dependabot secrets only, so the review would fail on the missing machine
  # credential. `@seidroid review` on one still works, because a comment runs with
  # the repository's secrets.
  seidroid-review:
    if: >-
      (github.event_name == 'pull_request' &&
        github.event.action != 'closed' &&
        github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        contains(github.event.comment.body, '@seidroid review') &&
        !contains(github.event.comment.body, '@seidroid review close'))
    uses: sei-protocol/uci/.github/workflows/seidroid-review.yml@ad9635aeeaec226785dd1756f666cffc538981f8 # v0.0.24
    permissions:
      contents: read
      pull-requests: write
      checks: write
      issues: write
    secrets:
      OMNIGENT_MACHINE_CLIENT_SECRET: ${{ secrets.OMNIGENT_MACHINE_CLIENT_SECRET }}
      SEIDROID_APP_ID: ${{ secrets.PLATFORM_CODE_AGENT_APP_ID }}
      SEIDROID_APP_PRIVATE_KEY: ${{ secrets.PLATFORM_CODE_AGENT_APP_PK }}
    with:
      mode: review
      approve-on-success: true
      allowed-team: 'sei-protocol/sei-core'

  seidroid-review-close:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '@seidroid review close')
    uses: sei-protocol/uci/.github/workflows/seidroid-review.yml@ad9635aeeaec226785dd1756f666cffc538981f8 # v0.0.24
    permissions:
      contents: read
      pull-requests: write
      checks: write
      issues: write
    secrets:
      OMNIGENT_MACHINE_CLIENT_SECRET: ${{ secrets.OMNIGENT_MACHINE_CLIENT_SECRET }}
      SEIDROID_APP_ID: ${{ secrets.PLATFORM_CODE_AGENT_APP_ID }}
      SEIDROID_APP_PRIVATE_KEY: ${{ secrets.PLATFORM_CODE_AGENT_APP_PK }}
    with:
      mode: close
      allowed-team: 'sei-protocol/sei-core'

  # Does not cover a fork: GitHub withholds secrets from a `pull_request` run whose
  # head is a fork, so the close fails and the sandbox is left running. On a fork
  # pull request, comment `@seidroid review close` before merging.
  seidroid-review-reclaim:
    # Skipped for a Dependabot pull request, because its run would lack the
    # secrets. A `@seidroid review` on one does create a session, and this job
    # cannot close it: comment `@seidroid review close` before merging, as for
    # a fork. Left open, its sandbox Pod still expires about an hour after the
    # last turn, but the session stays.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    uses: sei-protocol/uci/.github/workflows/seidroid-review.yml@ad9635aeeaec226785dd1756f666cffc538981f8 # v0.0.24
    permissions:
      contents: read
      pull-requests: write
      checks: write
      issues: write
    secrets:
      OMNIGENT_MACHINE_CLIENT_SECRET: ${{ secrets.OMNIGENT_MACHINE_CLIENT_SECRET }}
      SEIDROID_APP_ID: ${{ secrets.PLATFORM_CODE_AGENT_APP_ID }}
      SEIDROID_APP_PRIVATE_KEY: ${{ secrets.PLATFORM_CODE_AGENT_APP_PK }}
    with:
      mode: close
