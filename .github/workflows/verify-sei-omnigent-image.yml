name: Verify sei_omnigent image

# PR-gated build smoke for the sei-omnigent overlay image (PLT-735). Builds
# sei_omnigent/Dockerfile and runs an import smoke of the BUILT image, so a
# floated-transitive / missing-wheel break surfaces in the PR instead of on
# push:main where ecr.yml publishes.
#
# Fork-safe by construction: NO push, NO registry login, NO id-token, NO AWS
# OIDC, NO secrets. The build is the gate; nothing leaves the runner.

on:
  pull_request:
    paths:
      - 'sei_omnigent/**'
      - 'Dockerfile.host'
      - '.claude/**'
      - '.github/workflows/verify-sei-omnigent-image.yml'

permissions:
  contents: read

jobs:
  build-smoke:
    runs-on: ubuntu-latest
    # Hard backstop: this job builds one image + runs one import (~2 min). Cap it
    # at 10 min so a stalled runner/daemon fails fast. (2026-06-18: a host-level
    # `docker run` stalled and the job burned GitHub's full 6h max before cancel —
    # a transient, but the job had no tighter bound. This is that bound.)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the overlay image (no push)
        uses: docker/build-push-action@v6
        with:
          context: sei_omnigent
          file: sei_omnigent/Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          tags: sei-omnigent:pr-smoke

      - name: Import smoke of the built image
        # Proves the resolved runtime can import the K8s entrypoint module
        # (`python -m sei_omnigent.server.serve_main`): importing serve_main pulls
        # server/__init__ -> the seam -> the shim -> omnigent, so an unresolved
        # transitive raises HERE at import. Verified side-effect-free — `uvicorn.run`
        # is behind `if __name__ == "__main__"`, so a bare import resolves the
        # closure and returns in seconds; it does NOT bind a socket or boot. rc=0
        # is the healthy path.
        #
        # `--entrypoint python` is LOAD-BEARING: the image ENTRYPOINT is exec-form
        # `["python","-m","sei_omnigent.server.serve_main"]`, so a bare
        # `docker run <img> python -c ...` would APPEND those tokens to the
        # entrypoint and run the real server (`-m serve_main ... ignored args`),
        # which boots uvicorn and serves forever — NOT the import check. Overriding
        # the entrypoint to `python` makes the `-c` import actually run. (This is
        # the bug that made the old smoke run the server and hang to the 6h cap.)
        #
        # Defense-in-depth on hangs (the import is fast, so any hang is a
        # regression or a runner/daemon stall — never normal):
        #   * outer `timeout --kill-after=15s 90s docker run ...` bounds the HOST
        #     `docker run` (a daemon/container-start stall — the inner python
        #     timeout can't bound that).
        #   * inner `faulthandler.dump_traceback_later(60, exit=True)` dumps every
        #     thread's stack and exits non-zero if the import itself blocks 60s, so
        #     a future import-time deadlock fails WITH a stack, not a blind hang.
        # A timeout from either layer exits non-zero = FAILURE, not a pass.
        timeout-minutes: 3
        run: |
          timeout --kill-after=15s 90s \
            docker run --rm --entrypoint python sei-omnigent:pr-smoke \
            -X faulthandler -c "import faulthandler; faulthandler.dump_traceback_later(60, exit=True); import sei_omnigent.server.serve_main; print('import-ok')"

  host-build-smoke:
    # PR-gated build smoke for the runnable HOST image (Dockerfile.host, PLT-715).
    # Same fork-safe discipline as build-smoke (no push/login/secrets); the build
    # is the gate. Context is the repo root (the baked `.claude/` overlay lives
    # there). Beyond the server smoke's import check, the host image must prove
    # the toolchain is present, the launcher resolves, and it runs NON-ROOT (the
    # its PSS-restricted namespace requires runAsNonRoot).
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the host image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.host
          push: false
          load: true
          platforms: linux/amd64
          tags: sei-omnigent-host:pr-smoke

      - name: Toolchain + non-root smoke
        # The harness toolchain must be on PATH and the image must run as uid 1000
        # (NOT root) — the PSS-restricted namespace rejects root. `id -u`
        # asserts the baked USER; the binaries are what claude-native execs.
        timeout-minutes: 2
        run: |
          timeout --kill-after=15s 90s \
            docker run --rm --entrypoint bash sei-omnigent-host:pr-smoke -lc '
              set -euo pipefail
              test "$(id -u)" = "1000" || { echo "FAIL: not uid 1000 (got $(id -u))"; exit 1; }
              command -v git tmux node claude >/dev/null || { echo "FAIL: missing a harness binary"; exit 1; }
              test -f "$HOME/.claude/settings.json" || { echo "FAIL: overlay not baked at \$HOME/.claude"; exit 1; }
              # The /root-cause skill hard-requires a .claude/agents/ roster (it halts at its
              # Context-check gate without one — the PLT-715 prove-run failure mode), and the
              # PD-dogfood binds the root-cause skill. Assert both are baked HERE so a dropped
              # roster fails the build, not the first prod fire.
              ls "$HOME/.claude/agents"/*.md >/dev/null 2>&1 || { echo "FAIL: .claude/agents roster not baked (the /root-cause skill would halt)"; exit 1; }
              test -f "$HOME/.claude/skills/root-cause/SKILL.md" || { echo "FAIL: root-cause skill not baked (PD-dogfood discipline absent)"; exit 1; }
              echo "toolchain+nonroot-ok uid=$(id -u) home=$HOME agents=$(ls "$HOME/.claude/agents"/*.md | wc -l)"
            '

      - name: Launcher smoke
        # Proves the B1 launcher resolves end to end: `python -m
        # sei_omnigent.host_launch --help` installs the proxy-bearer patch (which
        # imports HostProcess through the shim -> omnigent) then runs `omnigent
        # host --help`, which click exits 0. So a missing omnigent symbol, a shim
        # drift, or a broken console-script wiring fails HERE, not at deploy.
        # --entrypoint python overrides the image's launcher entrypoint so `-m`
        # runs the help path rather than a bare `omnigent host` that would try to
        # open the WS tunnel and hang (the server-smoke's same lesson).
        timeout-minutes: 2
        run: |
          timeout --kill-after=15s 90s \
            docker run --rm --entrypoint python sei-omnigent-host:pr-smoke \
            -m sei_omnigent.host_launch --help
