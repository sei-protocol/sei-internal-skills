name: Verify Runner Image

# Asserts the `.claude` overlay actually REACHES a runner's $HOME, that the seeding
# hook holds its four stated properties, that the credential bridge resolves a
# mounted token, and that the runner and server bases name the same upstream release.
#
# Fork-safe by construction: NO push, NO registry login, NO id-token, NO AWS OIDC,
# NO secrets. The build is the gate; nothing leaves the runner. The base is the one
# runner-base.txt pins, upstream's public omnigent host image, so this gate builds on
# the same base ecr-runner.yml publishes on.
#
# An image-only check would pass while a real runner had nothing, which is how the
# roster went missing: `$HOME` is a fresh emptyDir per Pod, so an overlay staged at
# that path is shadowed by the mount.

on:
  pull_request:
    paths:
      - 'Dockerfile.runner'
      - 'Dockerfile.runner.dockerignore'
      - 'runner-base.txt'
      - 'server-base.txt'
      - '.claude/**'
      - 'scripts/managed-settings.json'
      - 'scripts/sei-runner-credential-check'
      - 'scripts/check-runner-credential-bridge.sh'
      - 'writing/styles/**'
      - 'writing/templates/consumer.vale.ini'
      - 'writing/templates/spec-template.md'
      - 'scripts/sei-writing-lint'
      - '.github/workflows/verify-runner-image.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Backstop: a stalled `docker run` can otherwise burn GitHub's full job max.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The runner and server bases name the same upstream release
        # The host dials the server over a tunnel neither side version-negotiates,
        # so a split between the two pins is a combination upstream does not test.
        run: |
          set -euo pipefail
          tag() { grep -m1 -vE '^\s*(#|$)' "$1" | sed -nE 's#^[^@]*:(v[^:@]+)@sha256:[0-9a-f]{64}$#\1#p'; }
          runner="$(tag runner-base.txt)"
          server="$(tag server-base.txt)"
          [ -n "$runner" ] && [ -n "$server" ] || {
            echo "FAIL: each base pin must read image:vX.Y.Z@sha256:<digest> (runner '${runner}', server '${server}')"; exit 1; }
          [ "$runner" = "$server" ] || {
            echo "FAIL: runner base is ${runner}, server base is ${server}"; exit 1; }
          echo "bases-match ${runner}"

      - name: Build the runner overlay on the pinned base
        # Plain `docker build`: this gate never pushes, and the daemon builder pulls
        # the public base directly.
        run: |
          set -euo pipefail
          base="$(grep -m1 -vE '^\s*(#|$)' runner-base.txt)"
          docker build --platform linux/amd64 -f Dockerfile.runner \
            --build-arg BASE_IMAGE="$base" \
            -t sei-runner-overlay:pr-smoke .

      - name: The credential bridge resolves a mounted token
        timeout-minutes: 4
        run: |
          set -euo pipefail
          docker run --rm --user 0 -e SEI_RUNNER_CREDENTIAL_CHECK_SKIP_NETWORK=1 \
            -v "$PWD/scripts/check-runner-credential-bridge.sh:/tmp/check-bridge.sh:ro" \
            --entrypoint bash sei-runner-overlay:pr-smoke -l /tmp/check-bridge.sh

      - name: Overlay reaches $HOME under an emptyDir-shadowed home
        # A tmpfs at /home/omnigent stands in for the Pod's emptyDir; --user matches
        # _RUN_AS_UID; `bash -lc` is how the sandbox launchers exec, which is what
        # sources the seeding hook.
        #
        # Asserts the SPECIFIC stewards /xreview and /root-cause halt without, not a
        # count. A count cannot distinguish a full roster from one missing
        # prose-steward.md, and `.claude/**` is in this workflow's own paths filter,
        # so that edit is the likeliest future regression.
        timeout-minutes: 4
        run: |
          set -euo pipefail
          docker run --rm --user 1000660000:1000660000 \
            --tmpfs /home/omnigent:exec,mode=1777 -e HOME=/home/omnigent \
            --entrypoint bash sei-runner-overlay:pr-smoke -lc '
              set -euo pipefail
              for a in prose-steward idiomatic-reviewer; do
                test -f "$HOME/.claude/agents/$a.md" || { echo "FAIL: pinned steward agents/$a.md not seeded (/xreview halts)"; exit 1; }
              done
              test -f "$HOME/.claude/skills/root-cause/SKILL.md" || { echo "FAIL: root-cause skill not seeded"; exit 1; }
              test -f "$HOME/.claude/skills/xreview/SKILL.md" || { echo "FAIL: xreview skill not seeded"; exit 1; }
              n=$(ls "$HOME/.claude/agents"/*.md | wc -l)
              # Floor, not a target. Reset 20 -> 17 by the 2026-08 slim-down, which
              # moved 3 agents to experimental/ and removed 3. It still catches an
              # ACCIDENTAL roster loss; a deliberate change moves this line with it.
              [ "$n" -ge 16 ] || { echo "FAIL: roster shrank to $n agents"; exit 1; }
              command -v specify >/dev/null || { echo "FAIL: specify CLI absent (sei-spec cannot scaffold .specify/)"; exit 1; }
              # settings.json is deliberately not shipped; see the dockerignore.
              ! test -e "$HOME/.claude/settings.json" || { echo "FAIL: settings.json was seeded into a writable HOME"; exit 1; }
              # The admin policy, asserted on the three properties it rests on:
              # present on every runner, unwritable by the uid it governs, and
              # parseable — a malformed file disables the policy silently, and an
              # unlisted tool then asks a question no one in a sandbox can answer.
              P=/etc/claude-code/managed-settings.json
              test -f "$P" || { echo "FAIL: $P absent (a headless permission request wedges the session)"; exit 1; }
              ! test -w "$P" || { echo "FAIL: $P is writable by the agent uid it governs"; exit 1; }
              python3 -c "import json,sys; d=json.load(open(sys.argv[1])); sys.exit(0 if d[\"permissions\"][\"allow\"] else 1)" "$P" \
                || { echo "FAIL: $P is not valid JSON carrying a non-empty permissions.allow"; exit 1; }
              echo "overlay-ok agents=$n skills=$(ls -d "$HOME/.claude/skills"/*/ | wc -l) specify=$(specify --version 2>&1 | head -1) policy=ok"
            '

      - name: The writing contract's gate runs in a sandbox, offline
        timeout-minutes: 4
        run: |
          set -euo pipefail
          rm -rf /tmp/caller
          mkdir -p /tmp/caller/specs/001-fixture /tmp/caller/specs/002-template
          # The wrapper walks up for `.git` to find the root the mode globs are
          # relative to, so an empty marker is enough: it reads the filesystem.
          mkdir -p /tmp/caller/.git
          cat > /tmp/caller/specs/001-fixture/spec.md <<'EOF'
          # Feature Specification: Fixture

          ## Requirements

          - **FR-001**: The system must write a record.
          EOF
          cp writing/templates/spec-template.md /tmp/caller/specs/002-template/spec.md
          # The bind mount is owned by the host uid, so the symlinks are made here
          # rather than by the sandbox user inside the container.
          ln -s /etc /tmp/caller/escape
          ln -s specs/001-fixture /tmp/caller/alias
          docker run --rm --user 1000660000:1000660000 --network none \
            --tmpfs /home/omnigent:exec,mode=1777 -e HOME=/home/omnigent \
            -v /tmp/caller:/workspace \
            --entrypoint bash sei-runner-overlay:pr-smoke -lc '
              set -uo pipefail
              command -v vale >/dev/null || { echo "FAIL: vale absent (sei-spec is told to lint and cannot)"; exit 1; }
              command -v sei-writing-lint >/dev/null || { echo "FAIL: sei-writing-lint absent"; exit 1; }
              command -v specify >/dev/null || { echo "FAIL: specify CLI lost to the Vale layer"; exit 1; }
              cd /workspace
              # Vale matches the mode globs against the argument, so the same file
              # linted by absolute path, or from its own directory, reports 0 errors
              # and exits 0. Each form is asserted because that regression is green.
              for form in "specs/001-fixture/spec.md" "/workspace/specs/001-fixture/spec.md"; do
                out="$(sei-writing-lint "$form" 2>&1)" && {
                  echo "FAIL: known-bad spec passed via $form"; echo "$out"; exit 1; }
                printf %s "$out" | grep -q "RFC2119-Keywords" || {
                  echo "FAIL: RFC 2119 rule did not fire via $form — the spec scope is not matching"
                  echo "$out"; exit 1; }
              done
              ( cd specs/001-fixture \
                && out="$(sei-writing-lint spec.md 2>&1)" && { echo "FAIL: known-bad spec passed from its own directory"; exit 1; }
                printf %s "$out" | grep -q "RFC2119-Keywords" || { echo "FAIL: RFC 2119 rule did not fire from the feature directory"; exit 1; } ) || exit 1
              sei-writing-lint specs/002-template/spec.md >/dev/null 2>&1 || {
                echo "FAIL: the Spec Kit template does not pass the gate it is linted by"
                sei-writing-lint specs/002-template/spec.md; exit 1; }
              # Containment is decided on the resolved directory, so a symlink cannot
              # carry an out-of-tree file in, and cannot drop an in-tree spec out of
              # the spec scope. Both directions are silent when they regress.
              sei-writing-lint escape/hostname >/dev/null 2>&1 && {
                echo "FAIL: a symlink resolving outside the root was linted anyway"; exit 1; }
              out="$(sei-writing-lint alias/spec.md 2>&1)" && {
                echo "FAIL: known-bad spec passed through an in-tree symlinked directory"; exit 1; }
              printf %s "$out" | grep -q "RFC2119-Keywords" || {
                echo "FAIL: the spec scope did not survive an in-tree symlinked directory"
                echo "$out"; exit 1; }
              echo "writing-gate-ok $(vale --version), offline, spec scope firing, symlinks contained"
            '

      - name: A failed copy withholds the marker instead of latching a half-seed
        # The marker must be written ONLY on copy success. Latching it after a partial
        # copy would seal a half-roster for the Pod's life, silently — the same
        # invisible degradation this overlay exists to remove. A 1MB tmpfs cannot hold
        # the tree, so the copy truncates.
        timeout-minutes: 4
        run: |
          set -euo pipefail
          docker run --rm --user 1000660000:1000660000 \
            --tmpfs /home/omnigent:mode=1777,size=1m -e HOME=/home/omnigent \
            --entrypoint bash sei-runner-overlay:pr-smoke -lc '
              set -euo pipefail
              if [ -e "$HOME/.claude/.sei-overlay" ]; then
                echo "FAIL: marker written despite a truncated copy — a half-roster is now latched"; exit 1
              fi
              echo "partial-copy-ok marker withheld, next shell retries"
            '

      - name: Reseed is non-destructive and idempotent
        # Two distinct properties. The marker short-circuit is one; `cp -n` is the
        # other, and it only matters on the path where the marker is absent. Clearing
        # the marker forces the copy to actually run again, otherwise this step would
        # pass even with a clobbering `cp -R`.
        #
        # Ownership mirrors production rather than being more permissive: the Pod's
        # emptyDir under fsGroup is root-owned, setgid, group-writable — the uid does
        # NOT own its own HOME. A fixture that grants ownership would hide a
        # permission bug that only bites in a real Pod.
        timeout-minutes: 4
        run: |
          set -euo pipefail
          vol="runner-smoke-home-${GITHUB_RUN_ID}"
          docker volume create "$vol" >/dev/null
          docker run --rm -v "$vol":/home/omnigent --entrypoint bash \
            sei-runner-overlay:pr-smoke -lc \
            'chown root:1000660000 /home/omnigent && chmod 2775 /home/omnigent'
          run() { docker run --rm --user 1000660000:1000660000 -v "$vol":/home/omnigent \
                    -e HOME=/home/omnigent --entrypoint bash sei-runner-overlay:pr-smoke -lc "$1"; }
          run 'true'
          run 'mkdir -p "$HOME/.claude/sessions" && echo live > "$HOME/.claude/sessions/mine.json" && echo EDITED > "$HOME/.claude/agents/prose-steward.md"'
          # Clear the marker so the reseed copy genuinely executes.
          run 'rm -f "$HOME/.claude/.sei-overlay"'
          run '
            set -euo pipefail
            test -f "$HOME/.claude/sessions/mine.json" || { echo "FAIL: claude-code state was removed"; exit 1; }
            grep -q EDITED "$HOME/.claude/agents/prose-steward.md" || { echo "FAIL: cp clobbered an existing file — no-clobber is not in effect"; exit 1; }
            test -e "$HOME/.claude/.sei-overlay" || { echo "FAIL: marker not re-written after a successful reseed"; exit 1; }
            echo "reseed-ok non-destructive, marker restored"
          '
          docker volume rm "$vol" >/dev/null

      - name: An unwritable home degrades quietly rather than failing the launch
        # Pods are restartPolicy: Never, so a login shell exiting non-zero wedges the
        # launch. A failed redirection also prints BEFORE `||` can apply, so this
        # catches a diagnostic emitted on every command in the session.
        timeout-minutes: 4
        run: |
          set -euo pipefail
          out=$(docker run --rm --user 1000660000:1000660000 --read-only \
                  --tmpfs /home/omnigent:ro -e HOME=/home/omnigent \
                  --entrypoint bash sei-runner-overlay:pr-smoke -lc 'echo shell-ok' 2>&1) || {
            echo "FAIL: login shell exited non-zero with an unwritable \$HOME"; exit 1; }
          echo "$out" | grep -q shell-ok || { echo "FAIL: shell produced no output"; exit 1; }
          if echo "$out" | grep -qiE "no such file|permission denied"; then
            echo "FAIL: seeding hook leaked a diagnostic to stderr:"; echo "$out"; exit 1
          fi
          echo "degrades-quietly-ok"
