# Release config for the sei-agent-driver binary.
#
# Run through uci's goreleaser-release.yml with working-directory set to this
# folder, so goreleaser resolves this file and the module beside it rather than
# a repository root that carries no go.mod.
version: 2

project_name: sei-agent-driver

before:
  hooks:
    - go mod download

builds:
  - id: sei-agent-driver
    main: ./cmd/sei-agent-driver
    binary: sei-agent-driver
    env:
      # No cgo, so the artifact runs on a runner image that ships no toolchain --
      # which is the whole reason this is released as a binary. The ARC image
      # bootstraps jq and gh because it has neither; it certainly has no Go.
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
      # A nested module cannot stamp VCS info, which is also why the version is
      # passed in below rather than read from runtime/debug.ReadBuildInfo.
      - -buildvcs=false
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: sei-agent-driver
    # A single binary, so the archive is a convenience rather than a layout. The
    # name carries the platform because a consumer picks one by filename.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]

checksum:
  name_template: "checksums.txt"

changelog:
  # The release notes are the tag's; goreleaser's commit list would repeat the
  # repository's whole history, most of which is skills rather than this module.
  disable: true

release:
  # Do not rewrite a release that already exists.
  mode: keep-existing
